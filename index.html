<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSITO Slickline Master Asset & Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#0ea5e9',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        success: '#10b981',
                        electronic: '#8b5cf6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans" onclick="hideAllDropdowns(event)">

    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-700 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
        <div class="flex items-center space-x-3 w-full md:w-auto">
            <div class="bg-accent/10 p-2.5 rounded-lg border border-accent/20">
                <i class="fa-solid fa-oil-well text-accent text-2xl"></i>
            </div>
            <div>
                <h1 class="text-base md:text-xl font-bold tracking-wide uppercase text-white">AMSITO Slickline Master Asset Manager</h1>
                <p class="text-[11px] text-slate-400">Asset & Maintenance Management System (Standardized 29-Cols)</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 md:gap-3 w-full md:w-auto justify-end">
            <span id="sync-status" class="text-xs px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i> Connected
            </span>
            <button onclick="initData()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 md:py-2 rounded-lg text-xs md:text-sm flex items-center gap-1.5 transition" title="Reload from Google Sheets">
                <i class="fa-solid fa-rotate"></i> Sync
            </button>
            <button onclick="openAddModal()" class="bg-accent hover:bg-sky-600 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-medium text-xs md:text-sm flex items-center gap-1.5 transition shadow-md">
                <i class="fa-solid fa-plus"></i> Add Equipment / Location
            </button>
            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 md:py-2 rounded-lg text-xs md:text-sm flex items-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> Backup
            </button>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="p-4 md:p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar: Hierarchy Tree -->
        <aside class="lg:col-span-1 bg-cardbg border border-slate-700/60 rounded-xl p-4 shadow-xl flex flex-col h-[68vh] lg:h-[80vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
                <h2 class="text-xs md:text-sm font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-sitemap text-accent"></i> Locations & Hierarchy
                </h2>
                <span id="total-nodes-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0 nodes</span>
            </div>
            
            <div class="mb-3 flex gap-1.5">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="tree-search" placeholder="Search tree..." oninput="filterTree(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-accent">
                </div>
                <button onclick="expandAllTree(true)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg text-xs border border-slate-700" title="Expand All"><i class="fa-solid fa-angles-down"></i></button>
                <button onclick="expandAllTree(false)" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg text-xs border border-slate-700" title="Collapse All"><i class="fa-solid fa-angles-up"></i></button>
            </div>

            <div id="tree-container" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs select-none">
                <!-- Hierarchy tree injected here -->
            </div>
        </aside>

        <!-- Content Area: Tables & Detail View -->
        <section class="lg:col-span-3 flex flex-col gap-4 md:gap-6">
            
            <!-- Filter Tabs -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl p-3 shadow-md relative">
                <div class="flex flex-wrap gap-1.5 items-center justify-start" id="tab-buttons">
                    <button onclick="switchTab('Locations')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition" data-tab="Locations">
                        <i class="fa-solid fa-location-dot mr-1"></i> Locations
                    </button>
                    <button onclick="switchTab('Slickline_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Tools">
                        <i class="fa-solid fa-screwdriver-wrench mr-1 text-sky-300"></i> Slickline Tools
                    </button>
                    <button onclick="switchTab('Containers_Units')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Containers_Units">
                        <i class="fa-solid fa-box mr-1 text-amber-400"></i> Container & Box
                    </button>
                    
                    <!-- Dropdown: Unit, Mast & Power Pack -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-unit-mast')" id="btn-group-unit-mast" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-truck-monster mr-1 text-sky-400"></i> Unit & Mast <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-unit-mast" class="hidden absolute left-0 mt-1 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('Unit'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-truck-monster text-sky-400"></i> Unit</button>
                            <button onclick="switchTab('Mast'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-tower-cell text-emerald-400"></i> Mast</button>
                            <button onclick="switchTab('Power Pack'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-car-battery text-amber-400"></i> Power Pack</button>
                        </div>
                    </div>
                    
                    <!-- Dropdown: Drums & Wires -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-drums-wires')" id="btn-group-drums-wires" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-dharmachakra text-amber-400"></i> Drums & Wires <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-drums-wires" class="hidden absolute left-0 mt-1 w-44 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('Drums'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-dharmachakra text-amber-400"></i> Drums</button>
                            <button onclick="switchTab('Wires'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-circle-notch text-sky-400"></i> Wires</button>
                        </div>
                    </div>

                    <!-- PCE Packages & Sets -->
                    <button onclick="switchTab('PCE_Equipment')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="PCE_Equipment">
                        <i class="fa-solid fa-shield-halved mr-1 text-purple-400"></i> PCE Packages & Sets
                    </button>

                    <button onclick="switchTab('Mechanical_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Mechanical_Tools">
                        <i class="fa-solid fa-wrench mr-1"></i> Mechanical Tools
                    </button>

                    <!-- Dropdown: Logging -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-logging')" id="btn-group-logging" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-microchip text-purple-400"></i> Logging <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-logging" class="hidden absolute left-0 mt-1 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('MPLT'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-chart-line text-cyan-400"></i> MPLT</button>
                            <button onclick="switchTab('PPS_Gauge'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-gauge text-sky-400"></i> PPS Gauge</button>
                            <button onclick="switchTab('Battery'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-battery-full text-emerald-400"></i> Battery</button>
                            <button onclick="switchTab('ART'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-400"></i> ART</button>
                            <button onclick="switchTab('Cement'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-fill-drip text-rose-400"></i> Cement Dump</button>
                            <button onclick="switchTab('Other'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-box-archive text-slate-400"></i> Other</button>
                        </div>
                    </div>

                    <button onclick="switchTab('MPI_LT')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-900/60 border border-rose-500/40 text-rose-200 hover:bg-rose-800 transition" data-tab="MPI_LT">
                        <i class="fa-solid fa-file-contract mr-1 text-rose-400"></i> MPI / LT
                    </button>

                    <!-- Tab Paper Work mới -->
                    <button onclick="switchTab('Paper_Work')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Paper_Work">
                        <i class="fa-solid fa-folder-open mr-1 text-emerald-400"></i> Paper Work
                    </button>
                </div>
            </div>

            <!-- Table Display Container -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl shadow-xl flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-700 flex flex-wrap justify-between items-center gap-2 bg-slate-800/50">
                    <div class="flex items-center gap-2">
                        <h3 id="current-table-title" class="font-semibold text-xs md:text-sm text-white uppercase tracking-wide">List</h3>
                        <span id="tree-filter-badge" class="hidden text-[11px] bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-md">
                            Filtered by Location <button onclick="resetTreeFilter()" class="ml-1 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </span>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="text" id="table-search" placeholder="Filter table..." oninput="filterCurrentTable(this.value)" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none focus:border-accent w-40 md:w-52">
                        <div class="text-xs text-slate-400" id="record-count">0 records</div>
                    </div>
                </div>

                <div class="w-full overflow-x-auto overflow-y-auto max-h-[62vh]">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead id="table-head" class="bg-slate-900/90 text-slate-400 uppercase font-medium border-b border-slate-700 sticky top-0 z-10">
                            <!-- Injected by JS -->
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-800">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal Form Add / Edit -->
    <div id="equipment-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-base text-white">Add New Equipment / Location</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="dynamic-form" onsubmit="handleFormSubmit(event)" autocomplete="off" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Select Management Group (Target Sheet)</label>
                    <select id="form-target-tab" onchange="renderFormFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                        <!-- Injected dynamically -->
                    </select>
                </div>

                <div id="dynamic-fields-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">Cancel</button>
                    <button type="submit" id="submit-btn" class="px-5 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Save & Sync Sheet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-sky-400"></i> Equipment & Container Details
                </h3>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-6 max-h-[75vh] overflow-y-auto" id="detail-modal-content"></div>

            <div class="px-6 py-3 bg-slate-800/80 border-t border-slate-700 flex justify-end gap-3">
                <button type="button" onclick="closeDetailModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Close</button>
                <button type="button" id="detail-edit-btn" class="px-4 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Edit Equipment</button>
            </div>
        </div>
    </div>

    <!-- Move Item Modal -->
    <div id="move-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-right-left text-accent"></i> Move Equipment Location
                </h3>
                <button onclick="closeMoveModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Selected Equipment:</label>
                    <input type="text" id="move-item-id" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-sky-400 font-semibold cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Select New Destination / Container / Unit / PCE Set:</label>
                    <select id="move-target-location" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent">
                        <!-- Injected by JS -->
                    </select>
                </div>
            </div>

            <div class="px-6 py-3 bg-slate-800/80 border-t border-slate-700 flex justify-end gap-3">
                <button type="button" onclick="closeMoveModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Cancel</button>
                <button type="button" onclick="confirmMoveItem()" class="px-4 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Confirm Move</button>
            </div>
        </div>
    </div>

    <!-- Upload Paper Work Modal -->
    <div id="paperwork-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-emerald-400"></i> Upload Hồ Sơ / Biểu Mẫu
                </h3>
                <button onclick="closePaperworkModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form onsubmit="handlePaperworkUpload(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Tên hồ sơ / Biểu mẫu hiển thị *</label>
                    <input type="text" id="pw-doc-name" required placeholder="VD: Timesheet Mẫu 2026..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Phân loại</label>
                    <select id="pw-category" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent">
                        <option value="Timesheet">Timesheet</option>
                        <option value="Job Report / Log">Job Report / Log</option>
                        <option value="Safety / JSA">Safety / JSA</option>
                        <option value="Certificate / MPI">Certificate / MPI</option>
                        <option value="Handover / Delivery">Handover / Delivery</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Chọn file từ máy tính (Excel, Word, PDF...) *</label>
                    <input type="file" id="pw-file-input" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-accent file:text-white hover:file:bg-sky-600">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Ghi chú (Remarks)</label>
                    <input type="text" id="pw-remarks" placeholder="Ghi chú thêm nếu có..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closePaperworkModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Hủy</button>
                    <button type="submit" id="pw-submit-btn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-medium transition shadow-md flex items-center gap-1.5">
                        <i class="fa-solid fa-upload"></i> Tải lên Drive
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxBLwH3F8t0EH-44uhipyv91UffkYlgW7NlkwP5dhUF2XcqHH3OaPgqZCaGW7V9k00NaA/exec";

        const UNIFIED_HEADERS = [
            'STT / Item No',           // 0
            'Asset ID / Code',         // 1
            'Asset Name / Description',// 2
            'Serial Number',           // 3
            'Part Number / Model',     // 4
            'Category / Type',         // 5
            'Brand / Manufacturer',    // 6
            'Technical Specs / Size',  // 7
            'Working Pressure (PSI)',  // 8
            'Max Temp (°C)',           // 9
            'Max Pressure (PSI)',      // 10
            'Length (m)',              // 11
            'Weight (Lbs)',            // 12
            'Quantity (Qty)',          // 13
            'Parent Location ID',      // 14
            'Storage Location',        // 15
            'Owner / Client',          // 16
            'MPI Date',                // 17
            'MPI Expire',              // 18
            'Load Test (LT) Date',     // 19
            'Load Test (LT) Expire',   // 20
            'Pressure Test Expire',    // 21
            'Calibration Date',        // 22
            'Calibration Expire',      // 23
            'Mfg / Purchase Date',     // 24
            'Expiry Date',             // 25
            'Status / Condition',      // 26
            'Usage History & Log',     // 27
            'Remarks / Notes'          // 28
        ];

        let appData = {
            "Locations": [],
            "MPLT": [],
            "PPS_Gauge": [],
            "ART": [],
            "Cement": [],
            "Battery": [],
            "MPI_LT": [],
            "Containers_Units": [],
            "Unit": [],
            "Mast": [],
            "Power Pack": [],

       function cleanVal(v) {
            if (v === null || v === undefined) return "";
            if (typeof v === 'object') return ""; // Chặn đứng lỗi nếu dữ liệu truyền vào là object/array lỗi
            let s = String(v).trim();
            if (s === "" || s === "NaN" || s === "None") return "";
            return s;
        }

        function getLocationName(locId) {
            const cleanId = cleanVal(locId);
            if (!cleanId || cleanId === "N/A") return "N/A";
            
            const foundLoc = (appData["Locations"] || []).find(l => cleanVal(l[1]) === cleanId);
            if (foundLoc) return cleanVal(foundLoc[2]) || cleanVal(foundLoc[5]) || cleanId;

            for (let tName of ['Containers_Units', 'Unit', 'Mast', 'Power Pack', 'PCE_Equipment']) {
                const item = (appData[tName] || []).find(i => i && (cleanVal(i[1]) === cleanId || cleanVal(i[3]) === cleanId));
                if (item) return cleanVal(item[2]) || cleanVal(item[3]) || cleanId;
            }
            return cleanId;
        }

        function getLocationPath(locId) {
            const cleanId = cleanVal(locId);
            if (!cleanId || cleanId === "N/A") return "Unknown Location (N/A)";
            const locs = appData["Locations"] || [];
            let path = [];
            let currId = cleanId;
            let visited = new Set();

            while (currId && !visited.has(currId)) {
                visited.add(currId);
                const found = locs.find(l => cleanVal(l[1]) === currId);
                if (found) {
                    path.unshift(`${cleanVal(found[1])} (${cleanVal(found[2]) || cleanVal(found[1])})`);
                    currId = cleanVal(found[14]);
                } else {
                    let parentLocId = "";
                    for (let tName of ['Containers_Units', 'Unit', 'Mast', 'Power Pack', 'PCE_Equipment']) {
                        const item = (appData[tName] || []).find(i => i && (cleanVal(i[1]) === currId || cleanVal(i[3]) === currId));
                        if (item) {
                            path.unshift(`${cleanVal(item[3]) || cleanVal(item[1])} (${cleanVal(item[2]) || currId})`);
                            parentLocId = cleanVal(item[14]);
                            break;
                        }
                    }
                    if (parentLocId && parentLocId !== currId) {
                        currId = parentLocId;
                    } else {
                        break;
                    }
                }
            }
            return path.length > 0 ? path.join(" ➔ ") : cleanId;
        }

        async function initData() {
            const indicator = document.getElementById("sync-status");
            let loadedFromServer = false;

            if (GOOGLE_SHEET_API_URL && GOOGLE_SHEET_API_URL.startsWith("http")) {
                try {
                    indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Loading Sheets...`;
                    const response = await fetch(GOOGLE_SHEET_API_URL);
                    const data = await response.json();
                    
                    if (data && typeof data === "object") {
                        if (data._headers) delete data._headers;
                        if (data["Power_Pack"] && !data["Power Pack"]) data["Power Pack"] = data["Power_Pack"];
                        if (data["Slickline_Toolstrings"] && !data["Slickline_Tools"]) data["Slickline_Tools"] = data["Slickline_Toolstrings"];
                        
                        appData = { ...appData, ...data };
                        loadedFromServer = true;
                        indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Connected`;
                    }
                } catch (e) {
                    console.log("Could not load directly from Google Sheet API:", e);
                }
            }

            if (!loadedFromServer) {
                const saved = localStorage.getItem("slickline_master_std29_v4");
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved);
                        appData = { ...appData, ...(parsed.appData || parsed) };
                        indicator.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Offline Mode`;
                    } catch (err) { console.error(err); }
                } else {
                    indicator.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Offline (Empty)`;
                }
            }

            populateFormTabSelect();
            localStorage.setItem("slickline_master_std29_v4", JSON.stringify({ appData }));
            renderTable(currentActiveTab);
            renderTree();
        }

        function saveDataLocal() {
            localStorage.setItem("slickline_master_std29_v4", JSON.stringify({ appData }));
            renderTable(currentActiveTab);
            renderTree();
        }

        async function syncToGoogleSheet(action, sheetName, rowData, itemId = null) {
            if (!GOOGLE_SHEET_API_URL || !GOOGLE_SHEET_API_URL.startsWith("http")) return;
            try {
                const payload = { action: action, sheetName: sheetName, row: rowData, id: itemId };
                const indicator = document.getElementById("sync-status");
                indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Syncing...`;

                fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.log("Background sync triggered"));

                setTimeout(() => {
                    indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Connected`;
                }, 800);
            } catch (error) {
                console.error("Google Sheet sync error:", error);
            }
        }

        function renderTree() {
            const container = document.getElementById("tree-container");
            const locs = appData["Locations"] || [];
            let totalNodes = locs.length;

            const assetTabs = ['Unit', 'Mast', 'Power Pack', 'Containers_Units', 'PCE_Equipment', 'Slickline_Tools', 'PPS_Gauge', 'Battery', 'ART', 'Cement', 'MPLT', 'Other'];
            assetTabs.forEach(t => { totalNodes += (appData[t] || []).length; });

            // Hàm buildBranch được bổ sung bộ nhớ vết (ancestors) chống vòng lặp vô hạn
            function buildBranch(parentId, ancestors = new Set()) {
                const cleanParent = cleanVal(parentId);
                if (!cleanParent || ancestors.has(cleanParent)) return "";
                
                const currentAncestors = new Set(ancestors);
                currentAncestors.add(cleanParent);

                const childrenLocs = locs.filter(l => cleanVal(l[14]) === cleanParent);
                
                let attachedEquipments = [];
                const allScanCategories = [
                    { key: 'Containers_Units', icon: 'fa-solid fa-box text-orange-400', color: 'text-orange-300' },
                    { key: 'Unit', icon: 'fa-solid fa-truck-monster text-sky-400', color: 'text-sky-300' },
                    { key: 'Mast', icon: 'fa-solid fa-tower-cell text-emerald-400', color: 'text-emerald-300' },
                    { key: 'Power Pack', icon: 'fa-solid fa-car-battery text-amber-400', color: 'text-amber-300' },
                    { key: 'PCE_Equipment', icon: 'fa-solid fa-shield-halved text-purple-400', color: 'text-purple-300' },
                    { key: 'Slickline_Tools', icon: 'fa-solid fa-screwdriver-wrench text-sky-300', color: 'text-sky-200' },
                    { key: 'PPS_Gauge', icon: 'fa-solid fa-gauge text-sky-400', color: 'text-sky-300' },
                    { key: 'Battery', icon: 'fa-solid fa-battery-full text-emerald-400', color: 'text-emerald-300' },
                    { key: 'ART', icon: 'fa-solid fa-bolt text-amber-400', color: 'text-amber-300' },
                    { key: 'MPLT', icon: 'fa-solid fa-chart-line text-cyan-400', color: 'text-cyan-300' },
                    { key: 'Cement', icon: 'fa-solid fa-fill-drip text-rose-400', color: 'text-rose-300' },
                    { key: 'Other', icon: 'fa-solid fa-box-archive text-slate-400', color: 'text-slate-300' }
                ];

                allScanCategories.forEach(cat => {
                    (appData[cat.key] || []).forEach((item, rIdx) => {
                        if (!item || !Array.isArray(item)) return;
                        if (cleanVal(item[14]) === cleanParent) {
                            attachedEquipments.push({
                                rowIndex: rIdx,
                                id: cleanVal(item[1]) || cleanVal(item[3]) || cleanVal(item[0]) || String(rIdx + 1),
                                serialNo: cleanVal(item[3]),
                                assetCode: cleanVal(item[1]),
                                name: cleanVal(item[2]) || cat.key,
                                category: cat.key,
                                icon: cat.icon,
                                textColor: cat.color
                            });
                        }
                    });
                });

                if (childrenLocs.length === 0 && attachedEquipments.length === 0) return "";
                
                let html = `<div id="tree-child-${cleanParent}" class="pl-3 space-y-1 border-l border-slate-700/60 mt-1">`;
                
                childrenLocs.forEach(child => {
                    const icon = getLocIcon(child[5] || child[2]);
                    const locId = cleanVal(child[1]) || cleanVal(child[0]);
                    const locName = cleanVal(child[2]) || cleanVal(child[5]) || locId;

                    html += `
                        <div class="tree-node-item" data-loc-id="${locId}">
                            <div class="flex items-center justify-between text-slate-200 bg-slate-800/40 hover:bg-slate-700/60 p-1.5 rounded transition cursor-pointer" onclick="filterByTreeNode('${locId}')">
                                <div class="flex items-center gap-1 truncate">
                                    <i id="tree-icon-${locId}" onclick="toggleTreeNode(event, '${locId}')" class="fa-solid fa-chevron-down text-accent text-[10px] mr-1 hover:text-white p-0.5"></i>
                                    <i class="${icon} text-accent text-xs mr-1"></i>
                                    <span class="truncate font-medium">${locId} - ${locName}</span>
                                </div>
                            </div>
                            ${buildBranch(locId, currentAncestors)}
                        </div>
                    `;
                });

                attachedEquipments.forEach(eq => {
                    let labelCode = eq.serialNo || eq.assetCode || eq.id;
                    let displayTitle = `${labelCode} - ${eq.name}`;

                    html += `
                        <div class="tree-node-item pl-1 mt-1" data-loc-id="${labelCode}">
                            <div class="flex items-center justify-between ${eq.textColor} bg-slate-800/60 hover:bg-slate-700 p-1.5 rounded transition cursor-pointer" onclick="openDetailModalByIndex('${eq.category}', ${eq.rowIndex})">
                                <div class="flex items-center gap-1 truncate">
                                    <span class="w-2"></span>
                                    <i class="${eq.icon} text-xs mr-1"></i>
                                    <span class="truncate font-medium">${displayTitle}</span>
                                </div>
                            </div>
                            ${buildBranch(eq.id, currentAncestors)}
                            ${buildBranch(eq.serialNo, currentAncestors)}
                        </div>
                    `;
                });

                html += '</div>';
                return html;
            }

            const roots = locs.filter(l => !cleanVal(l[14]));
            let rootHtml = "";
            roots.forEach(root => {
                const locId = cleanVal(root[1]) || cleanVal(root[0]);
                const locName = cleanVal(root[2]) || cleanVal(root[5]) || locId;
                const icon = getLocIcon(root[5] || root[2]);

                rootHtml += `
                    <div class="mb-1.5 tree-node-item" data-loc-id="${locId}">
                        <div class="flex items-center justify-between text-white bg-slate-800/90 hover:bg-slate-700 p-2 rounded transition cursor-pointer font-semibold border border-slate-700/50" onclick="filterByTreeNode('${locId}')">
                            <div class="flex items-center gap-1 truncate">
                                <i id="tree-icon-${locId}" onclick="toggleTreeNode(event, '${locId}')" class="fa-solid fa-chevron-down text-accent text-[10px] mr-1 hover:text-white p-0.5"></i>
                                <i class="${icon} text-emerald-400 text-xs mr-1"></i>
                                <span class="truncate">${locId} - ${locName}</span>
                            </div>
                        </div>
                        ${buildBranch(locId)}
                    </div>
                `;
            });

            container.innerHTML = rootHtml || '<div class="text-slate-500 italic p-2">No location hierarchy found.</div>';
            document.getElementById("total-nodes-badge").innerText = `${totalNodes} nodes`;
        }

        function filterTree(query) {

            activeColIndices.forEach(idx => {
                if (idx === 0) return;
                headHtml += `<th class="px-3 py-3 font-semibold">${UNIFIED_HEADERS[idx]}</th>`;
            });
            headHtml += `<th class="px-3 py-3 text-right">Actions</th></tr>`;
            document.getElementById("table-head").innerHTML = headHtml;

            let bodyHtml = "";
            if (rows.length === 0) {
                bodyHtml = `<tr><td colspan="${activeColIndices.length + 3}" class="px-4 py-8 text-center text-slate-500 italic">No data available in [${tabName}].</td></tr>`;
            } else {
                rows.forEach((row, index) => {
                    const stt = cleanVal(row[0]) || (index + 1);
                    const rowKey = `${tabName}-${index}`;
                    const contained = getContainedItems(tabName, row, index);
                    const hasChildren = contained.length > 0;

                    bodyHtml += `
                        <tr class="main-item-row hover:bg-slate-800/40 border-b border-slate-800 transition">
                            <td class="px-3 py-3 text-center">
                                ${hasChildren ? `<button onclick="toggleSubTable(event, '${rowKey}')" class="w-6 h-6 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition" title="Toggle contained items"><i id="expand-icon-${rowKey}" class="fa-solid fa-chevron-right text-slate-400 text-xs"></i></button>` : `<span class="text-slate-600">-</span>`}
                            </td>
                            <td class="px-3 py-3 font-semibold text-slate-400">${stt}</td>
                    `;

                    activeColIndices.forEach(idx => {
                        if (idx === 0) return;
                        let val = cleanVal(row[idx]) || '-';
                        if (idx === 15 && val === '-') {
                            val = getLocationName(row[14]) || '-';
                        }
                        bodyHtml += `<td class="px-3 py-3 text-slate-200 truncate max-w-xs" title="${val}">${val}</td>`;
                    });

                    bodyHtml += `
                            <td class="px-3 py-3 text-right relative" onclick="event.stopPropagation()">
                                <button onclick="toggleRowActionDropdown(event, 'row-dropdown-${rowKey}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg text-xs flex items-center gap-1.5 ml-auto border border-slate-700">
                                    <i class="fa-solid fa-bars text-accent"></i> Action <i class="fa-solid fa-chevron-down text-[9px]"></i>
                                </button>
                                <div id="row-dropdown-${rowKey}" class="hidden absolute right-4 mt-1 w-56 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-40 py-1.5 text-left divide-y divide-slate-800">
                                    <button onclick="openDetailModalByIndex('${tabName}', ${index}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-circle-info text-sky-400 w-4"></i> 1. Thông tin thiết bị</button>
                                    <button onclick="openDetailModalByIndex('${tabName}', ${index}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-boxes-stacked text-amber-400 w-4"></i> 2. Danh mục thiết bị bên trong</button>
                                    <button onclick="openMoveModalByIndex('${tabName}', ${index}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-right-left text-emerald-400 w-4"></i> 3. Di chuyển</button>
                                    <button onclick="openEditModalByIndex('${tabName}', ${index}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-sky-300 w-4"></i> 4. Sửa</button>
                                    <button onclick="deleteItemByIndex('${tabName}', ${index}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-rose-400 hover:bg-rose-600 hover:text-white flex items-center gap-2"><i class="fa-solid fa-trash-can w-4"></i> 5. Xóa</button>
                                </div>
                            </td>
                        </tr>
                    `;

                    if (hasChildren) {
                        bodyHtml += `
                            <tr id="sub-row-${rowKey}" class="hidden bg-slate-900/60 border-b border-slate-800">
                                <td colspan="${activeColIndices.length + 3}" class="p-3 pl-12">
                                    <div class="text-[11px] font-bold text-amber-400 mb-2 uppercase tracking-wide flex items-center gap-1.5">
                                        <i class="fa-solid fa-box-open"></i> Danh sách thiết bị chứa bên trong (${contained.length}):
                                    </div>
                                    <div class="bg-slate-950/60 rounded-lg p-2 border border-slate-800 space-y-1">
                        `;
                        contained.forEach((sub, sIdx) => {
                            bodyHtml += `
                                <div class="flex justify-between items-center text-xs p-1.5 hover:bg-slate-800/50 rounded transition">
                                    <div class="flex items-center gap-2">
                                        <span class="text-slate-500">${sIdx + 1}.</span>
                                        <span class="text-sky-300 font-medium">${sub.name}</span>
                                        <span class="text-amber-300 text-[11px]">(${sub.serialNo})</span>
                                    </div>
                                    <button onclick="openDetailModalByIndex('${sub.origTab}', ${sub.rowIndex})" class="text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded text-[11px]">
                                        <i class="fa-solid fa-circle-info mr-1 text-sky-400"></i> Xem chi tiết
                                    </button>
                                </div>
                            `;
                        });
                        bodyHtml += `
                                    </div>
                                </td>
                            </tr>
                        `;
                    }
                });
            }
            document.getElementById("table-body").innerHTML = bodyHtml;
            document.getElementById("current-table-title").innerText = `Management: ${tabName.replace(/_/g, ' ')}`;
            document.getElementById("record-count").innerText = `${rows.length} records`;
        }

        function renderLocationCombinedTable(locId) {
            const locName = getLocationName(locId);
            document.getElementById("current-table-title").innerText = `EQUIPMENT AT LOCATION: ${locName.toUpperCase()}`;
            
            let validLocIds = [cleanVal(locId)];
            function findChildren(pId) {
                (appData["Locations"] || []).forEach(l => {
                    if (cleanVal(l[14]) === pId) {
                        const childId = cleanVal(l[1]);
                        if (childId) {
                            validLocIds.push(childId);
                            findChildren(childId);
                        }
                    }
                });
            }
            findChildren(cleanVal(locId));

            const combinedList = [];
            Object.keys(appData).forEach(tName => {
                if (tName === "Locations" || tName === "_headers" || tName === "Paper_Work") return;

                (appData[tName] || []).forEach((item, rIdx) => {
                    if (!item || !Array.isArray(item)) return;
                    const parentLoc = cleanVal(item[14]);
                    const storageLoc = cleanVal(item[15]);

                    if (validLocIds.some(id => id && (parentLoc === id || storageLoc.includes(id) || storageLoc === locName))) {
                        combinedList.push({ 
                            rowIndex: rIdx,
                            stt: cleanVal(item[0]) || '-',
                            name: cleanVal(item[2]) || cleanVal(item[4]) || 'Equipment', 
                            serialNo: cleanVal(item[3]) || '-',
                            location: cleanVal(item[15]) || getLocationName(parentLoc),
                            status: cleanVal(item[26]) || 'Active',
                            remark: cleanVal(item[28]) || '-',
                            category: tName, 
                            origTab: tName 
                        });
                    }
                });
            });

            document.getElementById("table-head").innerHTML = `
                <tr>
                    <th class="px-4 py-3 font-semibold">No.</th>
                    <th class="px-4 py-3 font-semibold">Equipment Name</th>
                    <th class="px-4 py-3 font-semibold">Serial No</th>
                    <th class="px-4 py-3 font-semibold">Storage Location</th>
                    <th class="px-4 py-3 font-semibold">Status</th>
                    <th class="px-4 py-3 font-semibold">Remarks</th>
                    <th class="px-4 py-3 text-right">Actions</th>
                </tr>
            `;

            let bodyHtml = "";
            if (combinedList.length === 0) {
                bodyHtml = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-500 italic">No equipment found at this location level.</td></tr>`;
            } else {
                combinedList.forEach((item, idx) => {
                    bodyHtml += `
                        <tr class="hover:bg-slate-800/40 border-b border-slate-800 transition">
                            <td class="px-4 py-3 font-semibold text-slate-400">${idx + 1}</td>
                            <td class="px-4 py-3 text-slate-200 font-medium truncate max-w-xs">${item.name}</td>
                            <td class="px-4 py-3 text-amber-300 font-medium truncate max-w-[160px]">${item.serialNo}</td>
                            <td class="px-4 py-3 text-slate-300 truncate max-w-xs">${item.location}</td>
                            <td class="px-4 py-3 text-emerald-400 font-medium">${item.status}</td>
                            <td class="px-4 py-3 text-slate-400 truncate max-w-xs">${item.remark}</td>
                            <td class="px-4 py-3 text-right relative" onclick="event.stopPropagation()">
                                <button onclick="toggleRowActionDropdown(event, 'row-dropdown-combined-${idx}')" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg text-xs flex items-center gap-1.5 ml-auto border border-slate-700">
                                    <i class="fa-solid fa-bars text-accent"></i> Action <i class="fa-solid fa-chevron-down text-[9px]"></i>
                                </button>
                                <div id="row-dropdown-combined-${idx}" class="hidden absolute right-4 mt-1 w-56 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl z-40 py-1.5 text-left divide-y divide-slate-800">
                                    <button onclick="openDetailModalByIndex('${item.origTab}', ${item.rowIndex}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-circle-info text-sky-400 w-4"></i> 1. Thông tin thiết bị</button>
                                    <button onclick="openMoveModalByIndex('${item.origTab}', ${item.rowIndex}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-right-left text-emerald-400 w-4"></i> 3. Di chuyển</button>
                                    <button onclick="openEditModalByIndex('${item.origTab}', ${item.rowIndex}); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-sky-300 w-4"></i> 4. Sửa</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById("table-body").innerHTML = bodyHtml;
            document.getElementById("record-count").innerText = `${combinedList.length} items`;
        }

        function getAllLocationOptions(currentSelected = "") {
            const cleanCurr = cleanVal(currentSelected);
            let optionsHtml = `<option value="N/A">N/A (Unknown)</option>`;
            
            (appData["Locations"] || []).forEach(loc => {
                const locId = cleanVal(loc[1]) || cleanVal(loc[0]);
                const locName = cleanVal(loc[2]) || cleanVal(loc[5]) || locId;
                const isSelected = locId === cleanCurr ? "selected" : "";
                optionsHtml += `<option value="${locId}" ${isSelected}>[Base/Rig] ${locId} - ${locName}</option>`;
            });

            ['Unit', 'Mast', 'Power Pack', 'Containers_Units', 'PCE_Equipment'].forEach(tName => {
                (appData[tName] || []).forEach(item => {
                    if (!item || (!cleanVal(item[1]) && !cleanVal(item[3]))) return;
                    const itemId = cleanVal(item[1]) || cleanVal(item[0]);
                    const itemSerial = cleanVal(item[3]);
                    const itemName = cleanVal(item[2]);
                    const valCode = itemSerial || itemId;
                    const isSelected = (itemId === cleanCurr || itemSerial === cleanCurr) ? "selected" : "";
                    optionsHtml += `<option value="${valCode}" ${isSelected}>[${tName.replace(/_/g, ' ')}] ${valCode} - ${itemName}</option>`;
                });
            });

            return optionsHtml;
        }

        function openMoveModalByIndex(tabName, rowIndex) {
            const row = (appData[tabName] || [])[rowIndex];
            if (!row) return;
            movingItemContext = { tabName, rowIndex };

            const displayId = cleanVal(row[3]) || cleanVal(row[0]) || `#${rowIndex + 1}`;
            document.getElementById("move-item-id").value = `${displayId} - ${cleanVal(row[2])}`;

            const currentLocation = cleanVal(row[14]) || cleanVal(row[15]);
            document.getElementById("move-target-location").innerHTML = getAllLocationOptions(currentLocation);
            document.getElementById("move-modal").classList.remove("hidden");
            document.getElementById("move-modal").classList.add("flex");
        }

        function closeMoveModal() {
            document.getElementById("move-modal").classList.remove("flex");
            document.getElementById("move-modal").classList.add("hidden");
        }

        function confirmMoveItem() {
            const { tabName, rowIndex } = movingItemContext;
            const newLocId = document.getElementById("move-target-location").value;
            const row = (appData[tabName] || [])[rowIndex];

            if (row) {
                const syncKey = getRowUniqueKey(row, rowIndex);
                row[14] = newLocId;
                row[15] = getLocationName(newLocId);

                saveDataLocal();
                syncToGoogleSheet("update", tabName, row, syncKey);
                closeMoveModal();
                renderTable(currentActiveTab);
                renderTree();
            }
        }

        function resetTreeFilter() {
            document.getElementById("tree-filter-badge").classList.add("hidden");
            renderTable(currentActiveTab);
        }

        function renderFormFields(rowData = null) {
            const container = document.getElementById("dynamic-fields-container");
            let html = "";
            UNIFIED_HEADERS.forEach((headerName, idx) => {
                if (idx === 1) return;
                const val = rowData && rowData[idx] !== undefined && rowData[idx] !== null ? rowData[idx] : "";
                html += `
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">${headerName}</label>
                        <input type="text" name="f${idx}" value="${val}" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-accent" autocomplete="off">
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function openAddModal() {
            editingRowIndex = null;
            document.getElementById("modal-title").innerText = "Add New Equipment / Location";
            document.getElementById("submit-btn").innerText = "Save & Sync Sheet";
            document.getElementById("form-target-tab").disabled = false;
            document.getElementById("form-target-tab").value = currentActiveTab;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields();
        }

        function openEditModalByIndex(tabName, rowIndex) {
            const targetRow = (appData[tabName] || [])[rowIndex];
            if (!targetRow) return;
            editingRowIndex = rowIndex;
            const displayId = cleanVal(targetRow[3]) || cleanVal(targetRow[0]) || `#${rowIndex + 1}`;
            document.getElementById("modal-title").innerText = `Edit [${tabName}]: ${displayId}`;
            document.getElementById("submit-btn").innerText = "Update & Sync Sheet";
            document.getElementById("form-target-tab").value = tabName;
            document.getElementById("form-target-tab").disabled = true;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields(targetRow);
        }

        function closeModal() {
            document.getElementById("equipment-modal").classList.remove("flex");
            document.getElementById("equipment-modal").classList.add("hidden");
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const tab = document.getElementById("form-target-tab").value;
            if (!appData[tab] || !Array.isArray(appData[tab])) appData[tab] = [];

            let rowData = [];
            UNIFIED_HEADERS.forEach((_, idx) => {
                if (idx === 1) {
                    rowData.push("");
                } else {
                    const inputEl = document.querySelector(`input[name="f${idx}"]`);
                    rowData.push(inputEl ? inputEl.value : "");
                }
            });

            if (editingRowIndex !== null && appData[tab][editingRowIndex]) {
                const syncKey = getRowUniqueKey(appData[tab][editingRowIndex], editingRowIndex);
                appData[tab][editingRowIndex] = rowData;
                saveDataLocal();
                syncToGoogleSheet("update", tab, rowData, syncKey);
            } else {
                appData[tab].push(rowData);
                saveDataLocal();
                syncToGoogleSheet("append", tab, rowData);
            }

            closeModal();
            renderTable(currentActiveTab);
            renderTree();
        }

        function openDetailModalByIndex(tabName, rowIndex) {
            const row = (appData[tabName] || [])[rowIndex];
            if (!row) return;

            const locId = cleanVal(row[14]);
            const fullPath = getLocationPath(locId);
            const headerCode = cleanVal(row[3]) || cleanVal(row[0]) || `#${rowIndex + 1}`;

            let contentHtml = `
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 space-y-4">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                        <span class="text-xs uppercase font-semibold text-sky-400">Identifier: ${headerCode}</span>
                        <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700">Group: ${tabName.replace(/_/g, ' ')}</span>
                    </div>

                    <div class="bg-sky-950/40 border border-sky-500/30 p-3 rounded-lg flex flex-wrap justify-between items-center gap-2">
                        <div>
                            <span class="text-sky-400 block text-[10px] uppercase font-bold mb-1"><i class="fa-solid fa-route mr-1"></i> Storage Location Path:</span>
                            <span class="text-white font-semibold text-xs">${fullPath}</span>
                        </div>
                        <button onclick="closeDetailModal(); openMoveModalByIndex('${tabName}', ${rowIndex});" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition shadow">
                            <i class="fa-solid fa-right-left"></i> Di chuyển
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2.5 pt-1 text-xs">
            `;

            UNIFIED_HEADERS.forEach((headerName, idx) => {
                if (idx === 1) return;

                let displayVal = cleanVal(row[idx]);
                if (idx === 15 && !displayVal) {
                    displayVal = getLocationName(row[14]);
                }

                if (!displayVal || displayVal === 'N/A' || displayVal === '-') return;

                contentHtml += `
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[10px] uppercase font-medium">${headerName}</span>
                        <span class="text-slate-200 font-semibold text-xs mt-0.5 block break-words">${displayVal}</span>
                    </div>
                `;
            });

            contentHtml += `</div></div>`;

            document.getElementById("detail-modal-content").innerHTML = contentHtml;
            document.getElementById("detail-edit-btn").onclick = function() {
                closeDetailModal();
                openEditModalByIndex(tabName, rowIndex);
            };
            document.getElementById("detail-modal").classList.remove("hidden");
            document.getElementById("detail-modal").classList.add("flex");
        }

        function closeDetailModal() {
            document.getElementById("detail-modal").classList.remove("flex");
            document.getElementById("detail-modal").classList.add("hidden");
        }

        function openPaperworkModal() {
            document.getElementById("pw-doc-name").value = "";
            document.getElementById("pw-file-input").value = "";
            document.getElementById("pw-remarks").value = "";
            document.getElementById("paperwork-modal").classList.remove("hidden");
            document.getElementById("paperwork-modal").classList.add("flex");
        }

        function closePaperworkModal() {
            document.getElementById("paperwork-modal").classList.remove("flex");
            document.getElementById("paperwork-modal").classList.add("hidden");
        }

        function handlePaperworkUpload(event) {
            event.preventDefault();
            const fileInput = document.getElementById("pw-file-input");
            const file = fileInput.files[0];
            if (!file) return;

            if (file.size > 15 * 1024 * 1024) {
                alert("File dung lượng hơi lớn (>15MB), ông nên nén nhẹ lại trước khi upload nhé ạ!");
                return;
            }

            const submitBtn = document.getElementById("pw-submit-btn");
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang tải lên Drive...`;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64Data = e.target.result.split(",")[1];
                const payload = {
                    action: "upload_paperwork",
                    docName: document.getElementById("pw-doc-name").value,
                    category: document.getElementById("pw-category").value,
                    remarks: document.getElementById("pw-remarks").value,
                    fileName: file.name,
                    mimeType: file.type,
                    fileData: base64Data
                };

                try {
                    const tempRow = [
                        (appData["Paper_Work"] || []).length + 1,
                        payload.docName,
                        payload.category,
                        payload.fileName,
                        "",
                        "",
                        new Date().toISOString().slice(0, 10),
                        payload.remarks + " (Đang đồng bộ Drive...)"
                    ];
                    if (!appData["Paper_Work"]) appData["Paper_Work"] = [];
                    appData["Paper_Work"].push(tempRow);
                    renderTable("Paper_Work");
                    closePaperworkModal();

                    await fetch(GOOGLE_SHEET_API_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    setTimeout(() => { initData(); }, 3500);
                } catch (err) {
                    alert("Lỗi khi upload file: " + err);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-upload"></i> Tải lên Drive`;
                }
            };
            reader.readAsDataURL(file);
        }

        function deleteItemByIndex(tabName, rowIndex) {
            const row = (appData[tabName] || [])[rowIndex];
            if (!row) return;
            const syncKey = getRowUniqueKey(row, rowIndex);
            if (!confirm(`Are you sure you want to delete record [${syncKey}]?`)) return;

            appData[tabName].splice(rowIndex, 1);
            saveDataLocal();
            if (tabName !== "Paper_Work") {
                syncToGoogleSheet("delete", tabName, [], syncKey);
            }
            renderTable(currentActiveTab);
            renderTree();
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ appData }, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `amsito_master_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.onload = initData;
    </script>
</body>
</html>
