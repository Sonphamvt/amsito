<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slickline Asset & Equipment Management Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#0ea5e9',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        success: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans">

    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-700 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-accent/10 p-3 rounded-lg border border-accent/20">
                <i class="fa-solid fa-oil-well text-accent text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide uppercase text-white">AMSITO Slickline Asset Manager</h1>
                <p class="text-xs text-slate-400">Hệ thống quản lý thiết bị, container & vị trí giếng khoan offshore</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <span id="sync-status" class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i> Google Sheet Connected
            </span>
            <button onclick="openAddModal()" class="bg-accent hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition shadow-md">
                <i class="fa-solid fa-plus"></i> Thêm Thiết Bị / Vị Trí
            </button>
            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> Backup JSON
            </button>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar: Hierarchy Tree (Gia Phả Vị Trí & Container) -->
        <aside class="lg:col-span-1 bg-cardbg border border-slate-700/60 rounded-xl p-4 shadow-xl flex flex-col h-[75vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-sitemap text-accent"></i> Cây Vị Trí & Thiết Bị
                </h2>
                <span id="total-nodes-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0 mục</span>
            </div>
            
            <div class="mb-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="tree-search" placeholder="Tìm kiếm nhanh..." oninput="filterTree(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-accent">
                </div>
            </div>

            <div id="tree-container" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                <!-- Rendered dynamically by JS -->
            </div>
        </aside>

        <!-- Content Area: Tables & Detail View -->
        <section class="lg:col-span-3 flex flex-col gap-6">
            
            <!-- Filter Tabs -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl p-3 shadow-md flex flex-wrap gap-2 items-center justify-between">
                <div class="flex flex-wrap gap-1.5" id="tab-buttons">
                    <button onclick="switchTab('Locations_Clients')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition" data-tab="Locations_Clients">
                        <i class="fa-solid fa-location-dot mr-1"></i> Vị Trí & Khách Hàng
                    </button>
                    <button onclick="switchTab('Containers_Units')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Containers_Units">
                        <i class="fa-solid fa-box mr-1"></i> Container & Rack
                    </button>
                    <button onclick="switchTab('PCE_Equipment')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="PCE_Equipment">
                        <i class="fa-solid fa-shield-halved mr-1"></i> PCE Equipment
                    </button>
                    <button onclick="switchTab('Slickline_Reels')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Reels">
                        <i class="fa-solid fa-circle-notch mr-1"></i> Cuộn Dây Wire
                    </button>
                    <button onclick="switchTab('Downhole_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Downhole_Tools">
                        <i class="fa-solid fa-screwdriver-wrench mr-1"></i> Downhole Tools
                    </button>
                </div>

                <div class="flex items-center gap-2">
                    <span id="cert-warning-indicator" class="hidden text-xs bg-amber-500/10 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-lg items-center gap-1.5 cursor-pointer" onclick="filterExpiringCerts()">
                        <i class="fa-solid fa-triangle-exclamation"></i> <span id="expiring-count">0</span> Hết hạn kiểm định
                    </span>
                </div>
            </div>

            <!-- Table Display Container -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl shadow-xl flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                    <h3 id="current-table-title" class="font-semibold text-sm text-white uppercase tracking-wide">Danh sách Vị Trí & Khách Hàng</h3>
                    <div class="text-xs text-slate-400" id="record-count">0 bản ghi</div>
                </div>

                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead id="table-head" class="bg-slate-900/80 text-slate-400 uppercase font-medium border-b border-slate-700">
                            <!-- Injected by JS -->
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-800">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal Form Thêm / Sửa Thiết Bị -->
    <div id="equipment-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-150">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-base text-white">Thêm Mới Thiết Bị / Vị Trí</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="dynamic-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Chọn Nhóm Quản Lý (Tab mục tiêu)</label>
                    <select id="form-target-tab" onchange="renderFormFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                        <option value="Locations_Clients">1. Vị Trí & Khách Hàng (Locations_Clients)</option>
                        <option value="Containers_Units">2. Container & Rack (Containers_Units)</option>
                        <option value="PCE_Equipment">3. PCE Equipment (PCE_Equipment)</option>
                        <option value="Slickline_Reels">4. Cuộn Dây Slickline (Slickline_Reels)</option>
                        <option value="Downhole_Tools">5. Dụng Cụ Thả Giếng (Downhole_Tools)</option>
                    </select>
                </div>

                <div id="dynamic-fields-container" class="space-y-4">
                    <!-- Dynamic inputs rendered based on selected tab -->
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">Hủy</button>
                    <button type="submit" id="submit-btn" class="px-5 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Lưu & Đồng Bộ Sheet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic & Google Sheet API Sync -->
    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbz74oqQLBfubvtNcHKL2QOyO0Y7qfQZMjH8ps-0Y4nmcUocbr22m7gElvgGgR2YgiWa/exec";

        let appData = {
            Locations_Clients: [
                ["LOC001", "Base", "Amsito", "Vung Tau Base (Cảng Vietsovpetro)", "Active"],
                ["LOC002", "Offshore Platform", "Vietsovpetro", "Giàn MSP-1", "Active"],
                ["LOC003", "Offshore Platform", "Vietsovpetro", "Giàn BK-14", "Active"],
                ["LOC004", "Offshore Platform", "Murphy Oil", "Giàn Lac Su Vang", "Active"],
                ["LOC005", "Offshore Platform", "JVPC", "Giàn Rang Dong WHP-1", "Active"]
            ],
            Containers_Units: [
                ["CONT001", "AMS-MCE-01", "MCE Container", "LOC002", "2026-11-15", "2026-11-15", "Offshore"],
                ["CONT002", "AMS-PCE-02", "PCE Transport Frame", "LOC001", "2026-12-01", "2026-12-01", "At Base"],
                ["CONT003", "AMS-TB-05", "Tool Box Container", "LOC002", "2026-10-20", "2026-10-20", "Offshore"],
                ["CONT004", "AMS-RACK-01", "Storage Rack", "LOC001", "2027-05-10", "2027-05-10", "At Base"]
            ],
            PCE_Equipment: [
                ["PCE001", "BOP", "BOP-10K-001", "10000", "H2S", "4-1/16 Bowen Quick Union", "CONT002", "LOC001", "2026-12-15", "Ready"],
                ["PCE002", "Stuffing Box", "SB-5K-042", "5000", "Standard", "3-1/16 Bowen Quick Union", "CONT001", "LOC002", "2026-11-30", "In Use"],
                ["PCE003", "Lubricator 8ft", "LUB-10K-08A", "10000", "H2S", "4-1/16 Bowen Quick Union", "CONT002", "LOC001", "2027-03-10", "Ready"],
                ["PCE004", "Tool Catcher", "TC-10K-01", "10000", "H2S", "4-1/16 Bowen Quick Union", "CONT001", "LOC002", "2026-10-15", "In Use"]
            ],
            Slickline_Reels: [
                ["REEL001", "SUPRA 75", "0.125\"", "W-2025-089", "22500", "Cut 500ft on 2026-09-12 (Jarring job)", "CONT001", "LOC002", "In Use"],
                ["REEL002", "316L Stainless Steel", "0.108\"", "W-2024-112", "18000", "Cut 200ft on 2026-08-05", "CONT004", "LOC001", "Standby"],
                ["REEL003", "MP35N", "0.160\"", "W-2026-004", "25000", "New reel - No cut", "CONT004", "LOC001", "Ready"]
            ],
            Downhole_Tools: [
                ["DHT001", "R-Type Pulling Tool", "1.875\"", "PT-1875-09", "15/16\" Sucker Rod", "CONT003", "LOC002", "In Use"],
                ["DHT002", "Mechanical Jar", "1.500\"", "JAR-150-03", "15/16\" Sucker Rod", "CONT003", "LOC002", "In Use"],
                ["DHT003", "Stem Heavy Weight", "1.875\"", "STM-1875-12", "15/16\" Sucker Rod", "CONT004", "LOC001", "Ready"],
                ["DHT004", "MA Plug Body", "2.125\"", "MAP-2125-01", "1-1/16\" Sucker Rod", "CONT004", "LOC001", "Ready"],
                ["DHT005", "Rope Socket", "1.500\"", "RS-150-18", "15/16\" Sucker Rod", "CONT003", "LOC002", "In Use"]
            ]
        };

        const tableHeaders = {
            Locations_Clients: ["Location ID", "Category", "Client Name", "Location Name", "Status"],
            Containers_Units: ["Container ID", "Serial No", "Type", "Current Location ID", "MPI Expiry", "Load Test Expiry", "Status"],
            PCE_Equipment: ["PCE ID", "Equipment Type", "Serial No", "WP (PSI)", "Service", "Connection", "Parent Container", "Location ID", "Recert Expiry", "Status"],
            Slickline_Reels: ["Reel ID", "Wire Type", "Wire Size", "Serial No", "Length (ft)", "Cut History", "Parent Container", "Location ID", "Status"],
            Downhole_Tools: ["Tool ID", "Category", "OD Size", "Serial No", "Connection Thread", "Parent Container", "Location ID", "Status"]
        };

        let currentActiveTab = "Locations_Clients";
        let editingItemId = null; // Biến đánh dấu đang sửa ID nào (nếu null là đang Thêm mới)

        function initData() {
            const saved = localStorage.getItem("slickline_asset_data");
            if (saved) {
                try { appData = JSON.parse(saved); } catch (e) { console.error(e); }
            }
            renderTable(currentActiveTab);
            renderTree();
            checkExpiringCerts();
        }

        function saveDataLocal() {
            localStorage.setItem("slickline_asset_data", JSON.stringify(appData));
            renderTable(currentActiveTab);
            renderTree();
            checkExpiringCerts();
        }

        async function syncToGoogleSheet(action, sheetName, rowData, itemId = null) {
            if (!GOOGLE_SHEET_API_URL) return;
            try {
                const payload = {
                    action: action,     // "append", "update", "delete"
                    sheetName: sheetName,
                    row: rowData,
                    id: itemId
                };
                
                const indicator = document.getElementById("sync-status");
                indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Syncing...`;

                await fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                setTimeout(() => {
                    indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Google Sheet Connected`;
                }, 1000);
            } catch (error) {
                console.error("Lỗi đồng bộ Google Sheet:", error);
                document.getElementById("sync-status").innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-400"></i> Sync Error`;
            }
        }

        function switchTab(tabName) {
            currentActiveTab = tabName;
            document.querySelectorAll(".tab-btn").forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition";
                } else {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
            renderTable(tabName);
        }

        function renderTable(tabName, customRows = null) {
            const headers = tableHeaders[tabName];
            const rows = customRows || appData[tabName] || [];

            let headHtml = "<tr>";
            headers.forEach(h => headHtml += `<th class="px-4 py-3 font-semibold">${h}</th>`);
            headHtml += `<th class="px-4 py-3 text-right">Thao tác</th></tr>`;
            document.getElementById("table-head").innerHTML = headHtml;

            let bodyHtml = "";
            if (rows.length === 0) {
                bodyHtml = `<tr><td colspan="${headers.length + 1}" class="px-4 py-8 text-center text-slate-500 italic">Không có dữ liệu thiết bị trong mục này.</td></tr>`;
            } else {
                rows.forEach((row) => {
                    bodyHtml += `<tr class="hover:bg-slate-800/40 transition border-b border-slate-800/60">`;
                    row.forEach(cell => {
                        bodyHtml += `<td class="px-4 py-3 text-slate-300">${cell}</td>`;
                    });
                    bodyHtml += `<td class="px-4 py-3 text-right space-x-3">
                        <button onclick="openEditModal('${tabName}', '${row[0]}')" class="text-slate-400 hover:text-sky-400 transition" title="Chỉnh sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteItem('${tabName}', '${row[0]}')" class="text-slate-400 hover:text-red-400 transition" title="Xóa"><i class="fa-solid fa-trash-can"></i></button>
                    </td>`;
                    bodyHtml += `</tr>`;
                });
            }
            document.getElementById("table-body").innerHTML = bodyHtml;
            document.getElementById("current-table-title").innerText = `Quản lý: ${tabName.replace('_', ' ')}`;
            document.getElementById("record-count").innerText = `${rows.length} bản ghi`;
        }

        function renderTree() {
            const container = document.getElementById("tree-container");
            let html = "";
            let totalNodes = 0;

            const locations = appData.Locations_Clients || [];
            const containers = appData.Containers_Units || [];
            const pce = appData.PCE_Equipment || [];
            const reels = appData.Slickline_Reels || [];
            const tools = appData.Downhole_Tools || [];

            locations.forEach(loc => {
                totalNodes++;
                const locId = loc[0];
                const locName = loc[3];
                const locCat = loc[1];

                const childContainers = containers.filter(c => c[3] === locId);

                html += `
                <div class="border-l-2 border-accent/40 pl-2 py-1 space-y-1">
                    <div class="flex items-center gap-1.5 font-semibold text-white bg-slate-800/60 p-1.5 rounded">
                        <i class="fa-solid ${locCat === 'Base' ? 'fa-warehouse text-emerald-400' : 'fa-oil-well text-amber-400'} text-xs"></i>
                        <span class="truncate">${locName}</span>
                        <span class="ml-auto text-[10px] bg-slate-900 px-1.5 py-0.5 rounded text-slate-400">${locCat}</span>
                    </div>`;

                childContainers.forEach(cont => {
                    totalNodes++;
                    const contId = cont[0];
                    const contName = cont[1];
                    const contType = cont[2];

                    const inPCE = pce.filter(p => p[6] === contId);
                    const inReels = reels.filter(r => r[6] === contId);
                    const inTools = tools.filter(t => t[5] === contId);

                    html += `
                    <div class="ml-3 border-l-2 border-slate-700 pl-2 py-1 space-y-1">
                        <div class="flex items-center gap-1.5 text-slate-300 bg-slate-900/50 p-1 rounded">
                            <i class="fa-solid fa-box text-sky-400 text-xs"></i>
                            <span class="truncate font-medium">${contName} (${contType})</span>
                        </div>`;

                        inPCE.forEach(item => { totalNodes++; html += renderTreeNodeItem('PCE', item[1], item[2]); });
                        inReels.forEach(item => { totalNodes++; html += renderTreeNodeItem('Wire', item[1], item[3]); });
                        inTools.forEach(item => { totalNodes++; html += renderTreeNodeItem('Tool', item[1], item[3]); });

                    html += `</div>`;
                });

                html += `</div>`;
            });

            container.innerHTML = html || '<div class="text-slate-500 text-center py-4">Chưa có dữ liệu phân cấp.</div>';
            document.getElementById("total-nodes-badge").innerText = `${totalNodes} mục`;
        }

        function renderTreeNodeItem(type, label, serial) {
            let icon = "fa-shield-halved text-emerald-400";
            if (type === 'Wire') icon = "fa-circle-notch text-purple-400";
            if (type === 'Tool') icon = "fa-screwdriver-wrench text-amber-400";

            return `
            <div class="ml-4 flex items-center gap-1.5 text-slate-400 text-[11px] py-0.5">
                <i class="fa-solid ${icon} text-[10px]"></i>
                <span class="truncate">${label}</span>
                <span class="text-slate-500 font-mono text-[10px]">(${serial})</span>
            </div>`;
        }

        function filterTree(query) {
            const q = query.toLowerCase();
            document.querySelectorAll("#tree-container > div").forEach(el => {
                if (el.innerText.toLowerCase().includes(q)) {
                    el.style.display = "block";
                } else {
                    el.style.display = "none";
                }
            });
        }

        // Mở Modal để Thêm mới
        function openAddModal() {
            editingItemId = null;
            document.getElementById("modal-title").innerText = "Thêm Mới Thiết Bị / Vị Trí";
            document.getElementById("submit-btn").innerText = "Lưu & Đồng Bộ Sheet";
            document.getElementById("form-target-tab").disabled = false;
            document.getElementById("form-target-tab").value = currentActiveTab;
            
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields();
        }

        // Mở Modal để Chỉnh sửa thông tin có sẵn
        function openEditModal(tabName, itemId) {
            editingItemId = itemId;
            const targetRow = appData[tabName].find(r => r[0] === itemId);
            if (!targetRow) return;

            document.getElementById("modal-title").innerText = `Chỉnh Sửa Bản Ghi: ${itemId}`;
            document.getElementById("submit-btn").innerText = "Cập Nhật & Đồng Bộ Sheet";
            document.getElementById("form-target-tab").value = tabName;
            document.getElementById("form-target-tab").disabled = true; // Không đổi tab khi đang edit

            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields(targetRow);
        }

        function closeModal() {
            document.getElementById("equipment-modal").classList.remove("flex");
            document.getElementById("equipment-modal").classList.add("hidden");
        }

        // Sinh ô nhập liệu và điền dữ liệu sẵn nếu đang Edit
        function renderFormFields(rowData = null) {
            const tab = document.getElementById("form-target-tab").value;
            const container = document.getElementById("dynamic-fields-container");
            let html = "";
            const val = (idx, defaultVal = "") => rowData ? (rowData[idx] || "") : defaultVal;

            if (tab === "Locations_Clients") {
                html = `
                    <div><label class="block text-xs text-slate-300 mb-1">Location ID (VD: LOC006)</label><input type="text" name="f0" required ${rowData ? 'readonly class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-400 cursor-not-allowed"' : 'class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white"'} value="${val(0)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Category (Base / Offshore Platform / Rig)</label><input type="text" name="f1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white" value="${val(1, 'Offshore Platform')}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Client Name (VD: Vietsovpetro, Murphy Oil)</label><input type="text" name="f2" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white" value="${val(2)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Location Name (VD: Giàn MSP-9)</label><input type="text" name="f3" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white" value="${val(3)}"></div>

        // Xử lý gửi Form (Phân biệt Thêm mới vs Cập nhật)
        function handleFormSubmit(event) {
            event.preventDefault();
            const tab = document.getElementById("form-target-tab").value;
            const formInputs = document.querySelectorAll("#dynamic-fields-container input");
            let rowData = [];
            formInputs.forEach(input => rowData.push(input.value));

            if (editingItemId) {
                // Xử lý CẬP NHẬT (UPDATE)
                const index = appData[tab].findIndex(r => r[0] === editingItemId);
                if (index !== -1) {
                    appData[tab][index] = rowData;
                }
                saveDataLocal();
                syncToGoogleSheet("update", tab, rowData, editingItemId);
                alert(`Đã cập nhật bản ghi [${editingItemId}] thành công và đồng bộ Google Sheet!`);
            } else {
                // Xử lý THÊM MỚI (APPEND)
                appData[tab].push(rowData);
                saveDataLocal();
                syncToGoogleSheet("append", tab, rowData);
                alert("Đã thêm mới thành công và đang đồng bộ lên Google Sheet!");
            }

            closeModal();
            switchTab(tab);
        }

        function deleteItem(tabName, id) {
            if (!confirm(`Bạn có chắc muốn xóa bản ghi [${id}] này không?`)) return;
            appData[tabName] = appData[tabName].filter(row => row[0] !== id);
            saveDataLocal();
            
            syncToGoogleSheet("delete", tabName, [], id);
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `slickline_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function checkExpiringCerts() {
            let count = 0;
            const today = new Date();
            
            (appData.Containers_Units || []).forEach(c => {
                if (c[4] && new Date(c[4]) < new Date(today.getTime() + 30*24*60*60*1000)) count++;
            });
            (appData.PCE_Equipment || []).forEach(p => {
                if (p[8] && new Date(p[8]) < new Date(today.getTime() + 30*24*60*60*1000)) count++;
            });

            const indicator = document.getElementById("cert-warning-indicator");
            if (count > 0) {
                document.getElementById("expiring-count").innerText = count;
                indicator.classList.remove("hidden");
                indicator.classList.add("flex");
            }
        }

        function filterExpiringCerts() {
            switchTab("PCE_Equipment");
            const today = new Date();
            const filtered = appData.PCE_Equipment.filter(p => p[8] && new Date(p[8]) < new Date(today.getTime() + 30*24*60*60*1000));
            renderTable("PCE_Equipment", filtered);
        }
