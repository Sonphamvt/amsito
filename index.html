<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSITO Slickline Master Asset & Equipment Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#0ea5e9',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        success: '#10b981',
                        electronic: '#8b5cf6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans" onclick="hideContextMenu()">

    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-700 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-accent/10 p-3 rounded-lg border border-accent/20">
                <i class="fa-solid fa-oil-well text-accent text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wide uppercase text-white">AMSITO Slickline Master Asset Manager</h1>
                <p class="text-xs text-slate-400">Hệ thống quản lý phân cấp Kho - Khách hàng - Toolstrings & Thiết bị</p>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <span id="sync-status" class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i> Google Sheet Connected
            </span>
            <button onclick="openAddModal()" class="bg-accent hover:bg-sky-600 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2 transition shadow-md">
                <i class="fa-solid fa-plus"></i> Thêm Thiết Bị / Vị Trí
            </button>
            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> Backup JSON
            </button>
        </div>
    </header>

    <!-- Context Menu -->
    <div id="custom-context-menu" class="hidden fixed bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1.5 z-50 text-xs w-48 divide-y divide-slate-800">
        <div class="px-3 py-2 text-[10px] font-semibold text-slate-400 uppercase bg-slate-800/50 truncate" id="ctx-menu-title">Tùy chọn</div>
        <div class="py-1">
            <button onclick="ctxAction('view')" class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-sky-600 hover:text-white flex items-center gap-2 transition">
                <i class="fa-solid fa-circle-info text-sky-400"></i> Xem chi tiết
            </button>
            <button onclick="ctxAction('edit')" class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2 transition">
                <i class="fa-solid fa-pen text-sky-400"></i> Chỉnh sửa / Đổi tên
            </button>
            <button onclick="ctxAction('delete')" class="w-full text-left px-3 py-1.5 text-red-400 hover:bg-red-600 hover:text-white flex items-center gap-2 transition">
                <i class="fa-solid fa-trash-can"></i> Xóa thiết bị
            </button>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <main class="p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar: Hierarchy Tree -->
        <aside class="lg:col-span-1 bg-cardbg border border-slate-700/60 rounded-xl p-4 shadow-xl flex flex-col h-[75vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-sitemap text-accent"></i> Vị Trí & Thiết Bị
                </h2>
                <span id="total-nodes-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0 mục</span>
            </div>
            
            <div class="mb-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="tree-search" placeholder="Tìm kiếm nhanh..." oninput="filterTree(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-accent">
                </div>
            </div>

            <div id="tree-container" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
                <!-- Rendered dynamically -->
            </div>
        </aside>

        <!-- Content Area: Tables & Detail View -->
        <section class="lg:col-span-3 flex flex-col gap-6">
            
            <!-- Filter Tabs -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl p-3 shadow-md flex flex-wrap gap-2 items-center justify-between">
                <div class="flex flex-wrap gap-1.5" id="tab-buttons">
                    <button onclick="switchTab('Locations')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition" data-tab="Locations">
                        <i class="fa-solid fa-location-dot mr-1"></i> AMS & Clients
                    </button>
                    <button onclick="switchTab('Slickline_Toolstrings')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Toolstrings">
                        <i class="fa-solid fa-screwdriver-wrench mr-1 text-sky-300"></i> Slickline Tools
                    </button>
                    <button onclick="switchTab('Containers_Units')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Containers_Units">
                        <i class="fa-solid fa-box mr-1"></i> Container & Box
                    </button>
                    <button onclick="switchTab('Slickline_Units_Mast')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Units_Mast">
                        <i class="fa-solid fa-truck-monster mr-1"></i> Unit & Mast
                    </button>
                    <button onclick="switchTab('Slickline_Drums')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Drums">
                        <i class="fa-solid fa-dharmachakra mr-1 text-amber-400"></i> Tang Cáp
                    </button>
                    <button onclick="switchTab('Slickline_Wires')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Wires">
                        <i class="fa-solid fa-circle-notch mr-1 text-sky-400"></i> Sợi Cáp
                    </button>
                    <button onclick="switchTab('PCE_Equipment')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="PCE_Equipment">
                        <i class="fa-solid fa-shield-halved mr-1"></i> PCE
                    </button>
                    <button onclick="switchTab('Mechanical_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Mechanical_Tools">
                        <i class="fa-solid fa-wrench mr-1"></i> Cơ Khí Khác
                    </button>
                    <button onclick="switchTab('Electronic_Logging_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Electronic_Logging_Tools">
                        <i class="fa-solid fa-microchip mr-1 text-purple-400"></i> Logging
                    </button>
                </div>
            </div>

            <!-- Table Display Container -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl shadow-xl flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                    <div class="flex items-center gap-2">
                        <h3 id="current-table-title" class="font-semibold text-sm text-white uppercase tracking-wide">Danh sách</h3>
                        <span id="tree-filter-badge" class="hidden text-[11px] bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-md">
                            Đang lọc theo Cây phân cấp <button onclick="resetTreeFilter()" class="ml-1 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </span>
                    </div>
                    <div class="text-xs text-slate-400" id="record-count">0 bản ghi</div>
                </div>

                <div class="overflow-x-auto flex-1 max-h-[60vh] overflow-y-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead id="table-head" class="bg-slate-900/90 text-slate-400 uppercase font-medium border-b border-slate-700 sticky top-0 z-10">
                            <!-- Injected by JS -->
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-800">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal Form Thêm / Sửa Thiết Bị -->
    <div id="equipment-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-base text-white">Thêm Mới Thiết Bị / Vị Trí</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="dynamic-form" onsubmit="handleFormSubmit(event)" autocomplete="off" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Chọn Nhóm Quản Lý (Tab mục tiêu)</label>
                    <select id="form-target-tab" onchange="renderFormFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                        <option value="Locations">1. Locations (Vị Trí Phân Cấp)</option>
                        <option value="Slickline_Toolstrings">2. Slickline Tools</option>
                        <option value="Containers_Units">3. Container & Box</option>
                        <option value="Slickline_Units_Mast">4. Slickline Unit & Mast</option>
                        <option value="Slickline_Drums">5. Tang Cáp (Drums)</option>
                        <option value="Slickline_Wires">6. Sợi Cáp (Wires)</option>
                        <option value="PCE_Equipment">7. PCE Equipment</option>
                        <option value="Mechanical_Tools">8. Dụng Cụ Cơ Khí</option>
                        <option value="Electronic_Logging_Tools">9. Thiết Bị Điện Tử & Logging</option>
                    </select>
                </div>

                <div id="dynamic-fields-container" class="space-y-4"></div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">Hủy</button>
                    <button type="submit" id="submit-btn" class="px-5 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Lưu & Đồng Bộ Sheet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Chi Tiết -->
    <div id="detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-sky-400"></i> Thông Tin Chi Tiết Thiết Bị
                </h3>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-6 max-h-[75vh] overflow-y-auto" id="detail-modal-content"></div>

            <div class="px-6 py-3 bg-slate-800/80 border-t border-slate-700 flex justify-end gap-3">
                <button type="button" onclick="closeDetailModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Đóng</button>
                <button type="button" id="detail-edit-btn" class="px-4 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Chỉnh Sửa Thiết Bị</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwVok8qThyXH-98fJq3rQ7uVzdTSn2BDiJEbupXphhfpjNzJnKQsF36UsIsGdwyXtoB/exec";

        let appData = {
            Locations: [
                ["LOC_BASE", "Base / Kho / Xưởng", "AMSITO", "Kho / Xưởng Vũng Tàu Base", "", "Active"],
                ["LOC_BOAT_01", "Supply Boat", "Vietsovpetro", "Tàu Dịch Vụ PTSC 01", "", "Active"],
                ["LOC_PLAT_HL", "Platform (Giàn khoan)", "Vietsovpetro", "Giàn HL / Offshore Platform", "", "Active"],
                ["CONT_07", "Container", "AMSITO", "Container số 7", "LOC_PLAT_HL", "Active"],
                ["UNIT_01", "Winch Unit (Máy tời)", "AMSITO", "Máy tời Slickline Unit 01", "LOC_PLAT_HL", "Active"],
                ["BASKET_01", "Mast Basket", "AMSITO", "Basket chứa Mast & Phụ kiện", "LOC_BASE", "Active"],
                ["DRUMBOX_01", "Drum Box", "AMSITO", "Thùng chứa Drum Cáp AMS-D21", "LOC_BASE", "Active"],
                ["DRAWER_01", "Ngăn Kéo", "AMSITO", "Ngăn kéo số 1", "CONT_07", "Active"],
                ["WINCH_FRONT", "Vị trí Cáp Phía Trước (Winch Front)", "AMSITO", "Tang cáp phía trước tời 01", "UNIT_01", "Active"],
                ["WINCH_REAR", "Vị trí Cáp Phía Sau (Winch Rear)", "AMSITO", "Tang cáp phía sau tời 01", "UNIT_01", "Active"],
                ["TOOLBOX_01", "Tool Box", "AMSITO", "Hộp Handtool số 1", "CONT_07", "Active"],
                ["PCE_RACK_04", "PCE Rack", "AMSITO", "Rack PCE số 4", "LOC_PLAT_HL", "Active"],
                ["PCE_SLOT_02", "PCE Slot / Ngăn Rack", "AMSITO", "Ngăn số 2 thuộc Rack PCE 4", "PCE_RACK_04", "Active"]
            ],
            Slickline_Toolstrings: [],
            Containers_Units: [],
            Slickline_Units_Mast: [],
            Slickline_Drums: [],
            Slickline_Wires: [],
            PCE_Equipment: [],
            Mechanical_Tools: [],
            Electronic_Logging_Tools: []
        };

        const tableHeaders = {
            Locations: ["STT", "Location ID", "Phân loại", "AMSITO / Client", "Tên Vị Trí", "Parent ID", "Trạng thái"],
            Slickline_Toolstrings: ["STT", "Tool ID", "Description", "Contract Inquire", "Qty", "Length (m)", "Weight (Lbs)", "Part NO", "Asset NO", "Location", "Brand", "Status / Remark"],
            Containers_Units: ["STT", "Container ID", "Asset / Serial No", "Type / Equipment", "Location ID", "MPI Expiry", "Load Test Expiry", "Status"],
            Slickline_Units_Mast: ["STT", "Unit ID", "Equipment Name", "Serial No", "Power / Capacity", "Location ID", "Recert Expiry", "Status"],
            Slickline_Drums: ["STT", "Drum ID / Name", "DRUM Description", "Wire Information", "Cert Number", "Spool Date", "Length (m)", "Location", "Remark"],
            Slickline_Wires: ["STT", "Wire ID", "Wire Type", "Wire Size", "Serial No", "Breaking Strength", "Actual Length (ft)", "Parent Drum ID", "Lịch sử sử dụng", "Status"],
            PCE_Equipment: ["STT", "PCE ID", "Equipment Type", "Serial No", "WP (PSI)", "Service", "Connection", "Parent Container", "Location ID", "Recert Expiry", "Status"],
            Mechanical_Tools: ["STT", "Tool ID", "Category", "OD Size", "Asset / Serial No", "Connection Thread", "Parent Container", "Location ID", "Status"],
            Electronic_Logging_Tools: ["STT", "Tool ID", "Equipment Name", "Serial No", "OD Size", "Firmware / Specs", "Calibration Status", "Parent Container", "Location ID", "Status"]
        };

        let currentActiveTab = "Locations";
        let editingItemId = null;
        let contextTarget = { tabName: null, itemId: null };

        function hideContextMenu() {
            const menu = document.getElementById("custom-context-menu");
            if (menu && !menu.classList.contains("hidden")) {
                menu.classList.add("hidden");
            }
        }

        function showContextMenu(event, tabName, itemId, itemName) {
            event.preventDefault();
            event.stopPropagation();
            contextTarget = { tabName, itemId };
            const menu = document.getElementById("custom-context-menu");
            document.getElementById("ctx-menu-title").innerText = itemName || itemId;
            menu.style.top = `${event.clientY}px`;
            menu.style.left = `${event.clientX}px`;
            menu.classList.remove("hidden");
        }

        function ctxAction(action) {
            hideContextMenu();
            const { tabName, itemId } = contextTarget;
            if (!itemId) return;
            if (action === 'view') openDetailModal(tabName, itemId);
            else if (action === 'edit') openEditModal(tabName, itemId);
            else if (action === 'delete') deleteItem(tabName, itemId);
        }

        function getLocationName(locId) {
            if (!locId) return "N/A";
            const found = (appData.Locations || []).find(l => l[0] === locId);
            return found ? `${locId} (${found[3]})` : locId;
        }

        function getLocationPath(locId) {
            if (!locId || locId === "N/A") return "Vị trí không xác định (N/A)";
            const locs = appData.Locations || [];
            let path = [];
            let currId = locId;
            let visited = new Set();

            while (currId && !visited.has(currId)) {
                visited.add(currId);
                const found = locs.find(l => l[0] === currId);
                if (found) {
                    path.unshift(found[3] || found[0]);
                    currId = found[4]; // Nhảy lên Parent ID
                } else {
                    path.unshift(currId);
                    break;
                }
            }
            return path.join(" ➔ ");
        }

        function getLocIcon(type) {
            if (!type) return "fa-solid fa-location-dot";
            const t = type.toLowerCase();
            if (t.includes("base") || t.includes("kho") || t.includes("xưởng")) return "fa-solid fa-warehouse";
            if (t.includes("boat") || t.includes("tàu")) return "fa-solid fa-ship";
            if (t.includes("platform") || t.includes("giàn")) return "fa-solid fa-tower-observation";
            if (t.includes("container")) return "fa-solid fa-box";
            if (t.includes("winch") || t.includes("tời")) return "fa-solid fa-truck-monster";
            if (t.includes("basket") || t.includes("mast")) return "fa-solid fa-layer-group";
            if (t.includes("drum")) return "fa-solid fa-dharmachakra";
            if (t.includes("toolbox") || t.includes("hộp")) return "fa-solid fa-toolbox";
            if (t.includes("rack") || t.includes("kệ")) return "fa-solid fa-bars-staggered";
            return "fa-solid fa-folder-tree";
        }

        async function initData() {
            const indicator = document.getElementById("sync-status");
            let loadedFromServer = false;

            if (GOOGLE_SHEET_API_URL) {
                try {
                    indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Loading from Sheet...`;
                    const response = await fetch(GOOGLE_SHEET_API_URL);
                    const data = await response.json();
                    
                    if (data && typeof data === "object" && Object.keys(data).length > 0) {
                        // Merge fetched keys with fallback default structure
                        Object.keys(data).forEach(key => {
                            if (Array.isArray(data[key])) {
                                appData[key] = data[key];
                            }
                        });
                        loadedFromServer = true;
                        indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Google Sheet Connected`;
                    }
                } catch (e) {
                    console.log("Không tải được từ Google Sheet:", e);
                }
            }

            if (!loadedFromServer) {
                const saved = localStorage.getItem("slickline_asset_master_v18");
                if (saved) {
                    try { 
                        appData = JSON.parse(saved); 
                        indicator.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Offline Mode (Local Cache)`;
                    } catch (err) { console.error(err); }
                }
            } else {
                localStorage.setItem("slickline_asset_master_v18", JSON.stringify(appData));
            }

            renderTable(currentActiveTab);
            renderTree();
        }

        function saveDataLocal() {
            localStorage.setItem("slickline_asset_master_v18", JSON.stringify(appData));
            renderTable(currentActiveTab);
            renderTree();
        }

        async function syncToGoogleSheet(action, sheetName, rowData, itemId = null) {
            if (!GOOGLE_SHEET_API_URL) return;
            try {
                const payload = { action: action, sheetName: sheetName, row: rowData, id: itemId };
                const indicator = document.getElementById("sync-status");
                indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Syncing...`;

                fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.log("Background sync triggered"));

                setTimeout(() => {
                    indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Google Sheet Connected`;
                }, 800);
            } catch (error) {
                console.error("Lỗi đồng bộ Google Sheet:", error);
            }
        }

        function switchTab(tabName) {
            currentActiveTab = tabName;
            document.querySelectorAll(".tab-btn").forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition";
                } else {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
            document.getElementById("tree-filter-badge").classList.add("hidden");
            renderTable(tabName);
        }

        function filterByTreeNode(locId) {
            const badge = document.getElementById("tree-filter-badge");
            badge.classList.remove("hidden");
            renderLocationCombinedTable(locId);
        }

        function renderTree() {
            const container = document.getElementById("tree-container");
            const locs = appData.Locations || [];
            let totalNodes = locs.length;

            function buildBranch(parentId) {
                const children = locs.filter(l => (l[4] || "") === parentId);
                if (children.length === 0) return "";
                let html = '<div class="pl-3 space-y-1 border-l border-slate-700/60 mt-1">';
                children.forEach(child => {
                    const icon = getLocIcon(child[1]);
                    html += `
                        <div>
                            <div class="flex items-center justify-between text-slate-200 bg-slate-800/40 hover:bg-slate-700/60 p-1.5 rounded transition cursor-pointer" onclick="filterByTreeNode('${child[0]}')">
                                <div class="flex items-center gap-1.5 truncate">
                                    <i class="${icon} text-accent text-xs"></i>
                                    <span class="truncate font-medium">${child[0]} - ${child[3]}</span>
                                </div>
                            </div>
                            ${buildBranch(child[0])}
                        </div>
                    `;
                });
                html += '</div>';
                return html;
            }

            const roots = locs.filter(l => !l[4]);
            let rootHtml = "";
            roots.forEach(root => {
                const icon = getLocIcon(root[1]);
                rootHtml += `
                    <div class="mb-2">
                        <div class="flex items-center justify-between text-white bg-slate-800/80 hover:bg-slate-700 p-2 rounded transition cursor-pointer font-semibold" onclick="filterByTreeNode('${root[0]}')">
                            <div class="flex items-center gap-1.5 truncate">
                                <i class="${icon} text-emerald-400 text-xs"></i>
                                <span class="truncate">${root[0]} - ${root[3]}</span>
                            </div>
                        </div>
                        ${buildBranch(root[0])}
                    </div>
                `;
            });

            container.innerHTML = rootHtml || '<div class="text-slate-500 italic p-2">Chưa có vị trí phân cấp.</div>';
            document.getElementById("total-nodes-badge").innerText = `${totalNodes} mục`;
        }

        function renderLocationCombinedTable(locId) {
            const locName = getLocationName(locId);
            document.getElementById("current-table-title").innerText = `THIẾT BỊ TẠI VỊ TRÍ: ${locName.toUpperCase()}`;
            
            let validLocIds = [locId];
            function findChildren(pId) {
                (appData.Locations || []).forEach(l => {
                    if (l[4] === pId) {
                        validLocIds.push(l[0]);
                        findChildren(l[0]);
                    }
                });
            }
            findChildren(locId);

            const combinedList = [];
            const checkTabs = ["Slickline_Toolstrings", "Mechanical_Tools", "PCE_Equipment", "Containers_Units", "Slickline_Drums", "Slickline_Units_Mast", "Slickline_Wires", "Electronic_Logging_Tools"];
            
            checkTabs.forEach(tName => {
                (appData[tName] || []).forEach(item => {
                    const locField = item.join(" ");
                    if (validLocIds.some(id => locField.includes(id))) {
                        combinedList.push({ id: item[0], name: item[1] || item[2] || item[0], category: tName, origTab: tName });
                    }
                });
            });

            document.getElementById("table-head").innerHTML = `
                <tr>
                    <th class="px-4 py-3 font-semibold">STT</th>
                    <th class="px-4 py-3 font-semibold">Mã ID</th>
                    <th class="px-4 py-3 font-semibold">Nhóm Thiết Bị</th>
                    <th class="px-4 py-3 font-semibold">Tên / Mô Tả</th>
                    <th class="px-4 py-3 text-right">Thao tác</th>
                </tr>
            `;

            let bodyHtml = "";
            if (combinedList.length === 0) {
                bodyHtml = `<tr><td colspan="5" class="px-4 py-8 text-center text-slate-500 italic">Không tìm thấy thiết bị nào ở cấp vị trí này.</td></tr>`;
            } else {
                combinedList.forEach((item, idx) => {
                    bodyHtml += `
                        <tr class="hover:bg-slate-800/40 border-b border-slate-800 transition cursor-pointer" onclick="openDetailModal('${item.origTab}', '${item.id}')">
                            <td class="px-4 py-3 font-semibold text-slate-400">${idx + 1}</td>
                            <td class="px-4 py-3 text-sky-400 font-medium">${item.id}</td>
                            <td class="px-4 py-3 text-amber-300">${item.category}</td>
                            <td class="px-4 py-3 text-slate-200 truncate max-w-xs">${item.name}</td>
                            <td class="px-4 py-3 text-right">
                                <button onclick="openDetailModal('${item.origTab}', '${item.id}')" class="text-slate-400 hover:text-sky-300 transition"><i class="fa-solid fa-circle-info"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById("table-body").innerHTML = bodyHtml;
            document.getElementById("record-count").innerText = `${combinedList.length} thiết bị`;
        }

        function resetTreeFilter() {
            document.getElementById("tree-filter-badge").classList.add("hidden");
            renderTable(currentActiveTab);
        }

        function filterTree(query) {
            const q = query.toLowerCase();
            document.querySelectorAll("#tree-container > div").forEach(el => {
                el.style.display = el.innerText.toLowerCase().includes(q) ? "block" : "none";
            });
        }

        function renderFormFields(rowData = null) {
            const tab = document.getElementById("form-target-tab").value;
            const container = document.getElementById("dynamic-fields-container");
            let html = "";
            const val = (idx, defaultVal = "") => rowData ? (rowData[idx] || "") : defaultVal;

            const locs = appData.Locations || [];
            const types = [...new Set(locs.map(l => l[1]).filter(Boolean))];
            const clients = [...new Set(locs.map(l => l[2]).filter(Boolean))];
            const parentIds = [...new Set(locs.map(l => l[0]).filter(Boolean))];

            let optionsType = types.map(t => `<option value="${t}">`).join("");
            let optionsClient = clients.map(c => `<option value="${c}">`).join("");
            let optionsParent = parentIds.map(p => `<option value="${p}">`).join("");
            
            const defaultLocTypes = ["Base / Kho / Xưởng", "Supply Boat", "Platform (Giàn khoan)", "Container", "Winch Unit (Máy tời)", "Mast Basket", "Drum Box", "Tool Box", "Rack / Kệ", "Ngăn Kéo", "Vị trí Cáp Phía Trước (Winch Front)", "Vị trí Cáp Phía Sau (Winch Rear)"];
            defaultLocTypes.forEach(t => {
                if (!types.includes(t)) optionsType += `<option value="${t}">`;
            });

            if (tab === "Locations") {
                html = `
                    <datalist id="dl-loc-types">${optionsType}</datalist>
                    <datalist id="dl-loc-clients">${optionsClient}</datalist>
                    <datalist id="dl-loc-parents">${optionsParent}</datalist>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Location ID (Mã Vị Trí)</label>
                        <input type="text" name="f0" required autocomplete="off" ${rowData ? 'readonly class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-400 cursor-not-allowed"' : 'class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500" placeholder="VD: LOC_BASE, CONT_07, WINCH_FRONT"'} value="${val(0)}">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Phân loại Vị Trí</label>
                        <input type="text" name="f1" required list="dl-loc-types" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500" placeholder="Chọn có sẵn hoặc gõ mới..." value="${val(1)}">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">AMSITO / Client / Sở Hữu</label>
                        <input type="text" name="f2" required list="dl-loc-clients" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500" placeholder="Chọn Client hoặc gõ mới..." value="${val(2, 'AMSITO')}">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Tên Vị Trí / Mô Tả Chi Tiết</label>
                        <input type="text" name="f3" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500" placeholder="VD: Kho Vũng Tàu Base, Ngăn kéo số 1..." value="${val(3)}">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Parent ID (Mã vị trí cấp trên chứa mục này)</label>
                        <input type="text" name="f4" list="dl-loc-parents" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500" placeholder="Để trống nếu là Cấp 1 (Base/Giàn/Tàu)..." value="${val(4)}">
                    </div>

                    <div>
                        <label class="block text-xs text-slate-300 mb-1">Trạng thái</label>
                        <input type="text" name="f5" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(5, 'Active')}">
                    </div>
                `;
            } else if (tab === "Slickline_Toolstrings") {
                html = `
                    <datalist id="dl-loc-parents">${optionsParent}<option value="N/A">Vị trí không xác định (N/A)</option></datalist>
                    <div><label class="block text-xs text-slate-300 mb-1">Tool ID</label><input type="text" name="f0" required autocomplete="off" ${rowData ? 'readonly class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-400 cursor-not-allowed"' : 'class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"'} value="${val(0)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Description</label><input type="text" name="f1" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(1)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Contract Inquire</label><input type="text" name="f2" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(2)}"></div>
                    <div class="grid grid-cols-3 gap-2">
                        <div><label class="block text-xs text-slate-300 mb-1">Qty</label><input type="text" name="f3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(3)}"></div>
                        <div><label class="block text-xs text-slate-300 mb-1">Length (m)</label><input type="text" name="f4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(4)}"></div>
                        <div><label class="block text-xs text-slate-300 mb-1">Weight (Lbs)</label><input type="text" name="f5" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(5)}"></div>
                    </div>
                    <div><label class="block text-xs text-slate-300 mb-1">Part NO</label><input type="text" name="f6" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(6)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Asset NO</label><input type="text" name="f7" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(7)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Location ID / Drawer</label><input type="text" name="f8" list="dl-loc-parents" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(8)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Brand</label><input type="text" name="f9" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(9, 'PEAK')}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Status / Remark</label><input type="text" name="f10" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(10, 'New')}"></div>
                `;
            } else if (tab === "Slickline_Drums") {
                html = `
                    <datalist id="dl-loc-parents">${optionsParent}<option value="N/A">Vị trí không xác định (N/A)</option></datalist>
                    <div><label class="block text-xs text-slate-300 mb-1">Drum ID / Name (VD: AMS-01-SC08)</label><input type="text" name="f0" required autocomplete="off" ${rowData ? 'readonly class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-400 cursor-not-allowed"' : 'class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"'} value="${val(0)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">DRUM Description</label><input type="text" name="f1" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(1)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Wire Information (VD: 0.160" - Supa 75)</label><input type="text" name="f2" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(2)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Cert Number</label><input type="text" name="f3" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(3)}"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-xs text-slate-300 mb-1">Spool Date</label><input type="text" name="f4" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(4)}"></div>
                        <div><label class="block text-xs text-slate-300 mb-1">Length (m)</label><input type="text" name="f5" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(5)}"></div>
                    </div>
                    <div><label class="block text-xs text-slate-300 mb-1">Location ID (WINCH_FRONT, WINCH_REAR, DRUMBOX_01...)</label><input type="text" name="f6" list="dl-loc-parents" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(6)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Remark / Status</label><input type="text" name="f7" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(7)}"></div>
                `;
            } else {
                html = `
                    <datalist id="dl-loc-parents">${optionsParent}<option value="N/A">Vị trí không xác định (N/A)</option></datalist>
                    <div><label class="block text-xs text-slate-300 mb-1">ID Thiết Bị</label><input type="text" name="f0" required autocomplete="off" ${rowData ? 'readonly class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-400 cursor-not-allowed"' : 'class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"'} value="${val(0)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Tên / Mô tả Thiết Bị</label><input type="text" name="f1" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(1)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Location ID (Vị Trí Đang Lưu Trữ)</label><input type="text" name="f2" list="dl-loc-parents" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500" placeholder="Chọn Location ID hoặc gõ N/A..." value="${val(2)}"></div>
                `;
            }
            container.innerHTML = html;
        }

        function openAddModal() {
            editingItemId = null;
            document.getElementById("modal-title").innerText = "Thêm Mới Thiết Bị / Vị Trí";
            document.getElementById("submit-btn").innerText = "Lưu & Đồng Bộ Sheet";
            document.getElementById("form-target-tab").disabled = false;
            document.getElementById("form-target-tab").value = currentActiveTab;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields();
        }

        function openEditModal(tabName, itemId) {
            if (!itemId || itemId === "N/A") return;
            editingItemId = itemId;
            const targetRow = (appData[tabName] || []).find(r => r[0] === itemId);
            if (!targetRow) return;
            document.getElementById("modal-title").innerText = `Chỉnh Sửa: ${itemId}`;
            document.getElementById("submit-btn").innerText = "Cập Nhật & Đồng Bộ Sheet";
            document.getElementById("form-target-tab").value = tabName;
            document.getElementById("form-target-tab").disabled = true;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields(targetRow);
        }

        function closeModal() {
            document.getElementById("equipment-modal").classList.remove("flex");
            document.getElementById("equipment-modal").classList.add("hidden");
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const tab = document.getElementById("form-target-tab").value;
            if (!appData[tab] || !Array.isArray(appData[tab])) appData[tab] = [];

            let rowData = [];
            document.querySelectorAll("#dynamic-fields-container input, #dynamic-fields-container select").forEach(el => rowData.push(el.value));

            if (editingItemId) {
                const index = appData[tab].findIndex(r => r[0] === editingItemId);
                if (index !== -1) appData[tab][index] = rowData;
                saveDataLocal();
                syncToGoogleSheet("update", tab, rowData, editingItemId);
            } else {
                appData[tab].push(rowData);
                saveDataLocal();
                syncToGoogleSheet("append", tab, rowData);
            }

            closeModal();
            renderTable(currentActiveTab);
            renderTree();
        }

        function openDetailModal(tabName, itemId) {
            const row = (appData[tabName] || []).find(r => r[0] === itemId);
            if (!row) return;

            const headers = tableHeaders[tabName] || [];
            let locId = row[8] || row[7] || row[6] || row[4] || row[2] || "";
            let fullPath = getLocationPath(locId);

            let contentHtml = `
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 space-y-3">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                        <span class="text-xs uppercase font-semibold text-sky-400">Mã Định Danh (ID): ${row[0]}</span>
                        <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${row[row.length - 1] || 'Active'}</span>
                    </div>

                    <div class="bg-sky-950/40 border border-sky-500/30 p-3 rounded-lg">
                        <span class="text-sky-400 block text-[10px] uppercase font-bold mb-1"><i class="fa-solid fa-route mr-1"></i> Lộ Trình Vị Trí Lưu Trữ:</span>
                        <span class="text-white font-semibold text-xs">${fullPath}</span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2 text-xs">
            `;

            row.forEach((val, idx) => {
                if (idx === 0) return;
                const headerName = headers[idx] || `Thuộc tính ${idx}`;
                contentHtml += `
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[10px] uppercase font-medium">${headerName}</span>
                        <span class="text-slate-200 font-semibold text-sm mt-0.5 block">${val || 'N/A'}</span>
                    </div>
                `;
            });

            contentHtml += `</div></div>`;
            document.getElementById("detail-modal-content").innerHTML = contentHtml;
            document.getElementById("detail-edit-btn").onclick = function() {
                closeDetailModal();
                openEditModal(tabName, itemId);
            };
            document.getElementById("detail-modal").classList.remove("hidden");
            document.getElementById("detail-modal").classList.add("flex");
        }

        function closeDetailModal() {
            document.getElementById("detail-modal").classList.remove("flex");
            document.getElementById("detail-modal").classList.add("hidden");
        }

        function renderTable(tabName) {
            const headers = tableHeaders[tabName] || [];
            const rows = appData[tabName] || [];

            let headHtml = "<tr>";
            headers.forEach(h => headHtml += `<th class="px-4 py-3 font-semibold">${h}</th>`);
            headHtml += `<th class="px-4 py-3 text-right">Thao tác</th></tr>`;
            document.getElementById("table-head").innerHTML = headHtml;

            let bodyHtml = "";
            if (rows.length === 0) {
                bodyHtml = `<tr><td colspan="${headers.length + 1}" class="px-4 py-8 text-center text-slate-500 italic">Không có dữ liệu trong mục này.</td></tr>`;
            } else {
                rows.forEach((row, index) => {
                    bodyHtml += `<tr class="hover:bg-slate-800/40 border-b border-slate-800 transition cursor-pointer" onclick="openDetailModal('${tabName}', '${row[0]}')">`;
                    bodyHtml += `<td class="px-4 py-3 text-slate-400 font-semibold">${index + 1}</td>`;
                    row.forEach(cell => bodyHtml += `<td class="px-4 py-3 text-slate-300 truncate max-w-xs">${cell}</td>`);
                    bodyHtml += `<td class="px-4 py-3 text-right space-x-2" onclick="event.stopPropagation()">
                        <button onclick="openDetailModal('${tabName}', '${row[0]}')" class="text-slate-400 hover:text-sky-300 transition"><i class="fa-solid fa-circle-info"></i></button>
                        <button onclick="openEditModal('${tabName}', '${row[0]}')" class="text-slate-400 hover:text-sky-400 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteItem('${tabName}', '${row[0]}')" class="text-slate-400 hover:text-red-400 transition"><i class="fa-solid fa-trash-can"></i></button>
                    </td></tr>`;
                });
            }
            document.getElementById("table-body").innerHTML = bodyHtml;
            document.getElementById("current-table-title").innerText = `Quản lý: ${tabName.replace(/_/g, ' ')}`;
            document.getElementById("record-count").innerText = `${rows.length} bản ghi`;
        }

        function deleteItem(tabName, id) {
            if (!confirm(`Bạn có chắc chắn muốn xóa bản ghi [${id}] này không?`)) return;
            appData[tabName] = (appData[tabName] || []).filter(row => row[0] !== id);
            saveDataLocal();
            syncToGoogleSheet("delete", tabName, [], id);
            renderTable(currentActiveTab);
            renderTree();
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `slickline_master_v18_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.onload = initData;
    </script>
</body>
</html>
