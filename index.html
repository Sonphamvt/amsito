<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSITO Slickline Master Asset & Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#0ea5e9',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        success: '#10b981',
                        electronic: '#8b5cf6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans" onclick="hideAllDropdowns(event)">

    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-700 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
        <div class="flex items-center space-x-3 w-full md:w-auto">
            <div class="bg-accent/10 p-2.5 rounded-lg border border-accent/20">
                <i class="fa-solid fa-oil-well text-accent text-2xl"></i>
            </div>
            <div>
                <h1 class="text-base md:text-xl font-bold tracking-wide uppercase text-white">AMSITO Slickline Master Asset Manager</h1>
                <p class="text-[11px] text-slate-400">Asset & Maintenance Management System</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 md:gap-3 w-full md:w-auto justify-end">
            <span id="sync-status" class="text-xs px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i> Connected
            </span>
            <button onclick="openAddModal()" class="bg-accent hover:bg-sky-600 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-medium text-xs md:text-sm flex items-center gap-1.5 transition shadow-md">
                <i class="fa-solid fa-plus"></i> Add Equipment / Location
            </button>
            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 md:py-2 rounded-lg text-xs md:text-sm flex items-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> Backup
            </button>
        </div>
    </header>

    <!-- Main Dashboard Container -->
    <main class="p-4 md:p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar: Hierarchy Tree -->
        <aside class="lg:col-span-1 bg-cardbg border border-slate-700/60 rounded-xl p-4 shadow-xl flex flex-col h-[65vh] lg:h-[78vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
                <h2 class="text-xs md:text-sm font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-sitemap text-accent"></i> Locations & Hierarchy
                </h2>
                <span id="total-nodes-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0 nodes</span>
            </div>
            
            <div class="mb-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="tree-search" placeholder="Search locations & equipment..." oninput="filterTree(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-accent">
                </div>
            </div>

            <div id="tree-container" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs select-none">
                <!-- Hierarchy tree -->
            </div>
        </aside>

        <!-- Content Area: Tables & Detail View -->
        <section class="lg:col-span-3 flex flex-col gap-4 md:gap-6">
            
            <!-- Filter Tabs -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl p-3 shadow-md relative">
                <div class="flex flex-wrap gap-1.5 items-center justify-start" id="tab-buttons">
                    <button onclick="switchTab('Locations')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition" data-tab="Locations">
                        <i class="fa-solid fa-location-dot mr-1"></i> Locations
                    </button>
                    <button onclick="switchTab('Slickline_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Tools">
                        <i class="fa-solid fa-screwdriver-wrench mr-1 text-sky-300"></i> Slickline Tools
                    </button>
                    <button onclick="switchTab('Container')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Container">
                        <i class="fa-solid fa-box mr-1"></i> Container & Box
                    </button>
                    
                    <!-- Dropdown: Unit & Mast -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-unit-mast')" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-truck-monster mr-1 text-sky-400"></i> Unit & Mast <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-unit-mast" class="hidden absolute left-0 mt-1 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('Unit'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-truck-monster text-sky-400"></i> Unit</button>
                            <button onclick="switchTab('Mast'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-tower-cell text-emerald-400"></i> Mast</button>
                            <button onclick="switchTab('MastPP'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-car-battery text-amber-400"></i> Mast Power Pack</button>
                        </div>
                    </div>
                    
                    <!-- Dropdown: Drums & Wires -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-drums-wires')" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-dharmachakra text-amber-400"></i> Drums & Wires <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-drums-wires" class="hidden absolute left-0 mt-1 w-44 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('Slickline_Drums'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-dharmachakra text-amber-400"></i> Slickline Drums</button>
                            <button onclick="switchTab('Wires'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-circle-notch text-sky-400"></i> Wires</button>
                        </div>
                    </div>

                    <button onclick="switchTab('PCE_Equipment')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="PCE_Equipment">
                        <i class="fa-solid fa-shield-halved mr-1 text-purple-400"></i> PCE Packages & Sets
                    </button>

                    <button onclick="switchTab('Mechanical_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Mechanical_Tools">
                        <i class="fa-solid fa-wrench mr-1"></i> Mechanical Tools
                    </button>

                    <!-- Dropdown: Logging -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-logging')" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-microchip text-purple-400"></i> Logging <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-logging" class="hidden absolute left-0 mt-1 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('PPS'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-gauge text-sky-400"></i> PPS Gauge</button>
                            <button onclick="switchTab('Battery'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-battery-full text-emerald-400"></i> Battery</button>
                            <button onclick="switchTab('ART'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-bolt text-amber-400"></i> ART</button>
                            <button onclick="switchTab('Cement'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-fill-drip text-rose-400"></i> Cement Dump</button>
                            <button onclick="switchTab('Other'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-box-archive text-slate-400"></i> Other</button>
                        </div>
                    </div>

                    <button onclick="switchTab('MPI_LT')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-900/60 border border-rose-500/40 text-rose-200 hover:bg-rose-800 transition" data-tab="MPI_LT">
                        <i class="fa-solid fa-file-contract mr-1 text-rose-400"></i> MPI / LT
                    </button>
                </div>
            </div>

            <!-- Table Display Container -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl shadow-xl flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                    <div class="flex items-center gap-2">
                        <h3 id="current-table-title" class="font-semibold text-xs md:text-sm text-white uppercase tracking-wide">List</h3>
                        <span id="tree-filter-badge" class="hidden text-[11px] bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-md">
                            Filtered by Tree Node <button onclick="resetTreeFilter()" class="ml-1 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </span>
                    </div>
                    <div class="text-xs text-slate-400" id="record-count">0 records</div>
                </div>

                <div class="w-full overflow-x-auto overflow-y-auto max-h-[60vh]">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead id="table-head" class="bg-slate-900/90 text-slate-400 uppercase font-medium border-b border-slate-700 sticky top-0 z-10">
                            <!-- Injected by JS -->
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-800">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal Form Add / Edit -->
    <div id="equipment-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-base text-white">Add New Equipment / Location</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="dynamic-form" onsubmit="handleFormSubmit(event)" autocomplete="off" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Select Management Group (Target Sheet)</label>
                    <select id="form-target-tab" onchange="renderFormFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                        <!-- Injected dynamically -->
                    </select>
                </div>

                <div id="dynamic-fields-container" class="space-y-4"></div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">Cancel</button>
                    <button type="submit" id="submit-btn" class="px-5 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Save & Sync Sheet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-sky-400"></i> Equipment Details
                </h3>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-6 max-h-[75vh] overflow-y-auto" id="detail-modal-content"></div>

            <div class="px-6 py-3 bg-slate-800/80 border-t border-slate-700 flex justify-end gap-3">
                <button type="button" onclick="closeDetailModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Close</button>
                <button type="button" id="detail-edit-btn" class="px-4 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Edit Equipment</button>
            </div>
        </div>
    </div>

    <!-- Move Item Modal -->
    <div id="move-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-right-left text-accent"></i> Move Equipment Location
                </h3>
                <button onclick="closeMoveModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Selected Equipment:</label>
                    <input type="text" id="move-item-id" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-sky-400 font-semibold cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Select New Destination / Container / PCE Set:</label>
                    <select id="move-target-location" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent">
                        <!-- Injected by JS -->
                    </select>
                </div>
            </div>

            <div class="px-6 py-3 bg-slate-800/80 border-t border-slate-700 flex justify-end gap-3">
                <button type="button" onclick="closeMoveModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Cancel</button>
                <button type="button" onclick="confirmMoveItem()" class="px-4 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Confirm Move</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbyu7CLoIvSIjt8GQ_hp0nGzKT9KDoz_wBzC9wKz6RNDlYHxNWNBk8ulTeyxJ0iX9Uk/exec";

        let appData = {
            Locations: [],
            Unit: [],
            Mast: [],
            MastPP: [],
            Container: [],
            Slickline_Tools: [],
            Slickline_Drums: [],
            Wires: [],
            PCE_Equipment: [],
            Mechanical_Tools: [],
            PPS: [],
            Battery: [],
            ART: [],
            Cement: [],
            MPI_LT: [],
            Other: []
        };

        let tableHeaders = {};

        let currentActiveTab = "Locations";
        let editingItemId = null;
        let movingItemContext = { tabName: null, itemId: null };

        function toggleDropdown(event, dropdownId) {
            event.stopPropagation();
            const el = document.getElementById(dropdownId);
            document.querySelectorAll("[id^='dropdown-']").forEach(d => {
                if (d.id !== dropdownId) d.classList.add("hidden");
            });
            el.classList.toggle("hidden");
        }

        function hideAllDropdowns(event) {
            document.querySelectorAll("[id^='dropdown-']").forEach(d => d.classList.add("hidden"));
        }

        function getColIdxByKeywords(headers, priorityKeywords) {
            if (!headers || !headers.length) return -1;
            for (let kw of priorityKeywords) {
                for (let i = 0; i < headers.length; i++) {
                    const h = String(headers[i] || "").toLowerCase().trim();
                    if (h === kw.toLowerCase() || h.includes(kw.toLowerCase())) return i;
                }
            }
            return -1;
        }

        function getNameColIndex(tabName) {
            const headers = tableHeaders[tabName] || [];
            if (tabName === 'Slickline_Tools' || tabName === 'Slickline_Toolstrings') {
                const idx = getColIdxByKeywords(headers, ['description', 'equipment name', 'part no']);
                if (idx !== -1) return idx;
            }
            if (tabName === 'Slickline_Drums') {
                const idx = getColIdxByKeywords(headers, ['drum description', 'description', 'wire information']);
                if (idx !== -1) return idx;
            }
            if (tabName === 'PCE_Equipment') {
                const idx = getColIdxByKeywords(headers, ['equipment type', 'equipment name', 'description']);
                if (idx !== -1) return idx;
            }
            const found = getColIdxByKeywords(headers, ['equipment name', 'description', 'part number / chủng loại', 'wire type', 'category', 'type']);
            return found !== -1 ? found : (headers.length > 2 ? 2 : 1);
        }

        function getSerialColIndex(tabName) {
            const headers = tableHeaders[tabName] || [];
            if (tabName === 'Slickline_Tools' || tabName === 'Slickline_Toolstrings') {
                const idx = getColIdxByKeywords(headers, ['asset no', 'serial no', 'part no']);
                if (idx !== -1) return idx;
            }
            const found = getColIdxByKeywords(headers, ['serial no', 'serial number', 'asset no.', 'asset no', 'cert number', 'wire size']);
            return found !== -1 ? found : (headers.length > 3 ? 3 : 1);
        }

        function getLocationColIndex(tabName) {
            const headers = tableHeaders[tabName] || [];
            for (let i = 0; i < headers.length; i++) {
                const h = String(headers[i] || "").toLowerCase();
                if (h.includes("location id") || h.includes("pce id") || h.includes("parent drum id")) return i;
            }
            for (let i = 0; i < headers.length; i++) {
                const h = String(headers[i] || "").toLowerCase();
                if (h === "location") return i;
            }
            return headers.length > 1 ? 1 : 0;
        }

        function getLocationName(locId) {
            if (!locId || locId === "N/A" || locId === "NaN") return "N/A";
            const foundLoc = (appData.Locations || []).find(l => l[0] === locId);
            if (foundLoc) return foundLoc[3] || foundLoc[1] || locId;

            for (let tName of ['Unit', 'Container', 'Mast', 'MastPP', 'PCE_Equipment']) {
                const foundItem = (appData[tName] || []).find(item => item && (item[0] === locId || item[3] === locId || item[1] === locId));
                if (foundItem) {
                    const nameIdx = getNameColIndex(tName);
                    return foundItem[nameIdx] || foundItem[1] || locId;
                }
            }
            return locId;
        }

        function getLocationPath(locId) {
            if (!locId || locId === "N/A" || locId === "NaN") return "Unknown Location (N/A)";
            const locs = appData.Locations || [];
            let path = [];
            let currId = locId;
            let visited = new Set();

            while (currId && !visited.has(currId)) {
                visited.add(currId);
                const found = locs.find(l => l[0] === currId);
                if (found) {
                    path.unshift(found[3] || found[0]);
                    currId = found[4];
                } else {
                    let parentLocId = "";
                    for (let tName of ['Unit', 'Container', 'Mast', 'MastPP', 'PCE_Equipment']) {
                        const item = (appData[tName] || []).find(i => i && (i[0] === currId || i[3] === currId || i[1] === currId));
                        if (item) {
                            const nameIdx = getNameColIndex(tName);
                            path.unshift(item[nameIdx] || item[1] || currId);
                            const locIdx = getLocationColIndex(tName);
                            parentLocId = item[locIdx] || "";
                            break;
                        }
                    }
                    if (parentLocId && parentLocId !== currId) {
                        currId = parentLocId;
                    } else {
                        break;
                    }
                }
            }
            return path.join(" ➔ ");
        }

        async function initData() {
            const indicator = document.getElementById("sync-status");
            let loadedFromServer = false;

            if (GOOGLE_SHEET_API_URL) {
                try {
                    indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Loading Sheets...`;
                    const response = await fetch(GOOGLE_SHEET_API_URL);
                    const data = await response.json();
                    
                    if (data) {
                        if (data._headers) {
                            tableHeaders = data._headers;
                            delete data._headers;
                        }
                        appData = { ...appData, ...data };
                        loadedFromServer = true;
                        indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Connected`;
                    }
                } catch (e) {
                    console.log("Could not load directly from Google Sheet API:", e);
                }
            }

            if (!loadedFromServer) {
                const saved = localStorage.getItem("slickline_master_v25");
                if (saved) {
                    try { 
                        const parsed = JSON.parse(saved);
                        appData = parsed.appData || parsed;
                        if (parsed.headers) tableHeaders = parsed.headers;
                        indicator.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Offline Mode`;
                    } catch (err) { console.error(err); }
                }
            }

            populateFormTabSelect();
            localStorage.setItem("slickline_master_v25", JSON.stringify({ appData, headers: tableHeaders }));
            renderTable(currentActiveTab);
            renderTree();
        }

        function saveDataLocal() {
            localStorage.setItem("slickline_master_v25", JSON.stringify({ appData, headers: tableHeaders }));
            renderTable(currentActiveTab);
            renderTree();
        }

        async function syncToGoogleSheet(action, sheetName, rowData, itemId = null) {
            if (!GOOGLE_SHEET_API_URL) return;
            try {
                const payload = { action: action, sheetName: sheetName, row: rowData, id: itemId };
                const indicator = document.getElementById("sync-status");
                indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Syncing...`;

                fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.log("Background sync triggered"));

                setTimeout(() => {
                    indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Connected`;
                }, 800);
            } catch (error) {
                console.error("Google Sheet sync error:", error);
            }
        }

        function populateFormTabSelect() {
            const select = document.getElementById("form-target-tab");
            let html = "";
            const keys = Object.keys(tableHeaders.length ? tableHeaders : appData);
            keys.forEach((key, idx) => {
                if (key === "_headers") return;
                html += `<option value="${key}">${idx + 1}. ${key.replace(/_/g, ' ')}</option>`;
            });
            select.innerHTML = html;
        }

        function switchTab(tabName) {
            currentActiveTab = tabName;
            document.querySelectorAll(".tab-btn").forEach(btn => {
                if (btn.dataset.tab === tabName) {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition";
                } else {
                    btn.className = "tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
                }
            });
            document.getElementById("tree-filter-badge").classList.add("hidden");
            renderTable(tabName);
        }

        function filterByTreeNode(locId) {
            const badge = document.getElementById("tree-filter-badge");
            badge.classList.remove("hidden");
            renderLocationCombinedTable(locId);
        }

        function getLocIcon(type) {
            if (!type) return "fa-solid fa-location-dot";
            const t = type.toLowerCase();
            if (t.includes("base") || t.includes("kho") || t.includes("xưởng")) return "fa-solid fa-warehouse";
            if (t.includes("boat") || t.includes("tàu")) return "fa-solid fa-ship";
            if (t.includes("platform") || t.includes("giàn")) return "fa-solid fa-tower-observation";
            if (t.includes("container")) return "fa-solid fa-box";
            if (t.includes("winch") || t.includes("tời") || t.includes("unit")) return "fa-solid fa-truck-monster";
            if (t.includes("mast")) return "fa-solid fa-tower-cell";
            if (t.includes("drum")) return "fa-solid fa-dharmachakra";
            return "fa-solid fa-folder-tree";
        }

        function toggleTreeNode(event, childId) {
            event.stopPropagation();
            const childEl = document.getElementById(`tree-child-${childId}`);
            const iconEl = document.getElementById(`tree-icon-${childId}`);
            if (childEl) {
                if (childEl.classList.contains("hidden")) {
                    childEl.classList.remove("hidden");
                    if (iconEl) iconEl.className = "fa-solid fa-chevron-down text-accent text-[10px] mr-1";
                } else {
                    childEl.classList.add("hidden");
                    if (iconEl) iconEl.className = "fa-solid fa-chevron-right text-slate-400 text-[10px] mr-1";
                }
            }
        }

        function renderTree() {
            const container = document.getElementById("tree-container");
            const locs = appData.Locations || [];
            let totalNodes = locs.length;

            function buildBranch(parentId) {
                const childrenLocs = locs.filter(l => (l[4] || "") === parentId);
                
                let attachedEquipments = [];
                const categoriesToScan = [
                    { key: 'Unit', icon: 'fa-solid fa-truck-monster text-sky-400', color: 'text-sky-300' },
                    { key: 'Container', icon: 'fa-solid fa-box text-amber-400', color: 'text-amber-300' },
                    { key: 'Mast', icon: 'fa-solid fa-tower-cell text-emerald-400', color: 'text-emerald-300' }
                ];

                categoriesToScan.forEach(cat => {
                    (appData[cat.key] || []).forEach(item => {
                        if (!item || !Array.isArray(item)) return;
                        const locIdx = getLocationColIndex(cat.key);
                        const nameIdx = getNameColIndex(cat.key);
                        const serialIdx = getSerialColIndex(cat.key);

                        if (String(item[locIdx] || "").trim() === parentId.trim()) {
                            attachedEquipments.push({
                                id: String(item[0] || ""),
                                serialNo: String(item[serialIdx] || item[1] || ''),
                                name: String(item[nameIdx] || item[1] || cat.key),
                                category: cat.key,
                                icon: cat.icon,
                                textColor: cat.color
                            });
                        }
                    });
                });

                if (childrenLocs.length === 0 && attachedEquipments.length === 0) return "";
                
                let html = `<div id="tree-child-${parentId}" class="hidden pl-3 space-y-1 border-l border-slate-700/60 mt-1">`;
                
                childrenLocs.forEach(child => {
                    const icon = getLocIcon(child[1]);
                    html += `
                        <div class="tree-node-item" data-loc-id="${child[0]}">
                            <div class="flex items-center justify-between text-slate-200 bg-slate-800/40 hover:bg-slate-700/60 p-1.5 rounded transition cursor-pointer" onclick="filterByTreeNode('${child[0]}')">
                                <div class="flex items-center gap-1 truncate">
                                    <i id="tree-icon-${child[0]}" onclick="toggleTreeNode(event, '${child[0]}')" class="fa-solid fa-chevron-right text-slate-400 text-[10px] mr-1 hover:text-white p-0.5"></i>
                                    <i class="${icon} text-accent text-xs mr-1"></i>
                                    <span class="truncate font-medium">${child[0]} - ${child[3] || child[1]}</span>
                                </div>
                            </div>
                            ${buildBranch(child[0])}
                        </div>
                    `;
                });

                attachedEquipments.forEach(eq => {
                    let subItems = [];
                    let nodeKey = eq.serialNo || eq.id;

                    if (eq.category === 'Unit') {
                        (appData.Slickline_Drums || []).forEach(drum => {
                            if (!drum || !Array.isArray(drum)) return;
                            const drumLocIdx = getLocationColIndex('Slickline_Drums');
                            const drumLocField = String(drum[drumLocIdx] || ""); 
                            const drumRemark = String(drum[8] || "").toLowerCase(); 

                            if (drumLocField === eq.serialNo || drumLocField === eq.id || drumLocField.includes(eq.serialNo)) {
                                let positionLabel = "Drum";
                                let badgeColor = "bg-slate-700 text-slate-300";

                                if (drumLocField.toLowerCase().includes("front") || drumRemark.includes("front")) {
                                    positionLabel = "Front";
                                    badgeColor = "bg-sky-500/20 text-sky-300 border border-sky-500/30";
                                } else if (drumLocField.toLowerCase().includes("rear") || drumRemark.includes("rear")) {
                                    positionLabel = "Rear";
                                    badgeColor = "bg-amber-500/20 text-amber-300 border border-amber-500/30";
                                }

                                const drumNameIdx = getNameColIndex('Slickline_Drums');

                                subItems.push({
                                    tab: 'Slickline_Drums',
                                    id: drum[0],
                                    name: drum[drumNameIdx] || drum[1],
                                    label: positionLabel,
                                    badgeClass: badgeColor,
                                    icon: 'fa-solid fa-dharmachakra text-amber-400'
                                });
                            }
                        });
                    }

                    let hasSubBranch = subItems.length > 0;
                    let displayTitle = `${eq.serialNo || eq.id} - ${eq.name}`;

                    html += `
                        <div class="tree-node-item pl-1 mt-1" data-loc-id="${nodeKey}">
                            <div class="flex items-center justify-between ${eq.textColor} bg-slate-800/60 hover:bg-slate-700 p-1.5 rounded transition cursor-pointer" onclick="openDetailModal('${eq.category}', '${eq.id}')">
                                <div class="flex items-center gap-1 truncate">
                                    ${hasSubBranch ? `<i id="tree-icon-eq-${nodeKey}" onclick="toggleTreeNode(event, 'eq-${nodeKey}')" class="fa-solid fa-chevron-right text-slate-400 text-[10px] mr-1 hover:text-white p-0.5"></i>` : '<span class="w-3"></span>'}
                                    <i class="${eq.icon} text-xs mr-1"></i>
                                    <span class="truncate font-medium">${displayTitle}</span>
                                </div>
                            </div>
                    `;

                    if (hasSubBranch) {
                        html += `<div id="tree-child-eq-${nodeKey}" class="hidden pl-3 space-y-1 border-l border-slate-700/60 mt-1">`;
                        subItems.forEach(sub => {
                            html += `
                                <div class="p-1.5 pl-3 text-slate-300 hover:bg-slate-800/60 rounded flex items-center justify-between text-[11px] cursor-pointer" onclick="openDetailModal('${sub.tab}', '${sub.id}')">
                                    <div class="flex items-center gap-1.5 truncate">
                                        <i class="${sub.icon} text-xs"></i>
                                        <span class="truncate">${sub.id} - ${sub.name}</span>
                                    </div>
                                    ${sub.label ? `<span class="text-[9px] px-1.5 py-0.5 rounded font-semibold uppercase ${sub.badgeClass}">${sub.label}</span>` : ''}
                                </div>
                            `;
                        });
                        html += `</div>`;
                    }

                    html += `</div>`;
                });

                html += '</div>';
                return html;
            }

            const roots = locs.filter(l => !l[4] || l[4] === "NaN");
            let rootHtml = "";
            roots.forEach(root => {
                const icon = getLocIcon(root[1]);
                rootHtml += `
                    <div class="mb-1 tree-node-item" data-loc-id="${root[0]}">
                        <div class="flex items-center justify-between text-white bg-slate-800/80 hover:bg-slate-700 p-2 rounded transition cursor-pointer font-semibold" onclick="filterByTreeNode('${root[0]}')">
                            <div class="flex items-center gap-1 truncate">
                                <i id="tree-icon-${root[0]}" onclick="toggleTreeNode(event, '${root[0]}')" class="fa-solid fa-chevron-right text-slate-400 text-[10px] mr-1 hover:text-white p-0.5"></i>
                                <i class="${icon} text-emerald-400 text-xs mr-1"></i>
                                <span class="truncate">${root[0]} - ${root[3] || root[1]}</span>
                            </div>
                        </div>
                        ${buildBranch(root[0])}
                    </div>
                `;
            });

            container.innerHTML = rootHtml || '<div class="text-slate-500 italic p-2">No location hierarchy found.</div>';
            document.getElementById("total-nodes-badge").innerText = `${totalNodes} nodes`;
        }

        function filterTree(query) {
            const q = query.toLowerCase().trim();
            const nodeElements = document.querySelectorAll("#tree-container .tree-node-item");

            if (!q) {
                nodeElements.forEach(el => { el.style.display = "block"; });
                return;
            }

            nodeElements.forEach(el => {
                const text = el.innerText.toLowerCase();
                el.style.display = text.includes(q) ? "block" : "none";
            });
        }

                    <th class="px-4 py-3 font-semibold">Remarks</th>

            `;

            } else {
                rows.forEach((row, index) => {
                    const eqName = nameIdx !== -1 ? (row[nameIdx] || 'Equipment') : (row[2] || row[1] || 'Equipment');
                    const serialNo = serialIdx !== -1 ? (row[serialIdx] || 'N/A') : (row[3] || row[1] || 'N/A');
                    
                    let rawLoc = locIdx !== -1 ? row[locIdx] : '';
                    let locVal = getLocationName(rawLoc);
                    if (!locVal || locVal === 'N/A') locVal = rawLoc || 'N/A';

                    const remarkVal = remarkIdx !== -1 ? (row[remarkIdx] || '-') : '-';

        function renderLocationCombinedTable(locId) {
            const locName = getLocationName(locId);
            document.getElementById("current-table-title").innerText = `EQUIPMENT AT LOCATION: ${locName.toUpperCase()}`;
            
            let validLocIds = [locId];
            function findChildren(pId) {
                (appData.Locations || []).forEach(l => {
                    if (String(l[4] || "") === pId) {
                        validLocIds.push(String(l[0] || ""));
                        findChildren(String(l[0] || ""));
                    }
                });
            }
            findChildren(locId);

            const combinedList = [];
            Object.keys(appData).forEach(tName => {
                if (tName === "Locations" || tName === "_headers") return;
                const locIdx = getLocationColIndex(tName);
                const headers = tableHeaders[tName] || [];
                const nameIdx = getNameColIndex(tName);
                const serialIdx = getSerialColIndex(tName);
                const statusIdx = getColIdxByKeywords(headers, ['status', 'tình trạng']);
                const remarkIdx = getColIdxByKeywords(headers, ['remark', 'remarks', 'lịch sử', 'note']);

                (appData[tName] || []).forEach(item => {
                    if (!item || !Array.isArray(item)) return;
                    const locField = String(item[locIdx] || "");
                    if (validLocIds.some(id => id && locField.includes(id))) {
                        let serialNo = serialIdx !== -1 ? (item[serialIdx] || 'N/A') : 'N/A';
                        let eqName = nameIdx !== -1 ? (item[nameIdx] || 'Equipment') : 'Equipment';
                        let statusVal = statusIdx !== -1 ? (item[statusIdx] || 'Good') : 'Good';
                        let remarkVal = remarkIdx !== -1 ? (item[remarkIdx] || '-') : '-';
                        let locVal = getLocationName(locField);

                        combinedList.push({ 
                            id: String(item[0] || "N/A"), 
                            serialNo: String(serialNo),
                            name: String(eqName), 
                            location: String(locVal),
                            status: String(statusVal),
                            remark: String(remarkVal),
                            category: tName, 
                            origTab: tName 
                        });
                    }
                });
            });

            document.getElementById("table-head").innerHTML = `
                <tr>
                    <th class="px-4 py-3 font-semibold">No.</th>
                    <th class="px-4 py-3 font-semibold">Equipment Name</th>
                    <th class="px-4 py-3 font-semibold">Serial No</th>
                    <th class="px-4 py-3 font-semibold">Location</th>
                    <th class="px-4 py-3 font-semibold">Status</th>
                    <th class="px-4 py-3 font-semibold">Remarks</th>
                    <th class="px-4 py-3 text-right">Actions</th>
                </tr>
            `;

            let bodyHtml = "";
            if (combinedList.length === 0) {
                bodyHtml = `<tr><td colspan="7" class="px-4 py-8 text-center text-slate-500 italic">No equipment found at this location level.</td></tr>`;
            } else {
                combinedList.forEach((item, idx) => {
                    bodyHtml += `
                        <tr class="hover:bg-slate-800/40 border-b border-slate-800 transition cursor-pointer" onclick="openDetailModal('${item.origTab}', '${item.id}')">
                            <td class="px-4 py-3 font-semibold text-slate-400">${idx + 1}</td>
                            <td class="px-4 py-3 text-slate-200 font-medium truncate max-w-xs">${item.name}</td>
                            <td class="px-4 py-3 text-sky-400 font-medium">${item.serialNo}</td>
                            <td class="px-4 py-3 text-slate-300 truncate max-w-xs">${item.location}</td>
                            <td class="px-4 py-3 text-emerald-400 font-medium">${item.status}</td>
                            <td class="px-4 py-3 text-slate-400 truncate max-w-xs">${item.remark}</td>
                            <td class="px-4 py-3 text-right space-x-2" onclick="event.stopPropagation()">
                                <button onclick="openMoveModal('${item.origTab}', '${item.id}')" class="text-slate-400 hover:text-emerald-400 transition" title="Move Location"><i class="fa-solid fa-right-left"></i></button>
                                <button onclick="openDetailModal('${item.origTab}', '${item.id}')" class="text-slate-400 hover:text-sky-300 transition" title="View Details"><i class="fa-solid fa-circle-info"></i></button>
                                <button onclick="openEditModal('${item.origTab}', '${item.id}')" class="text-slate-400 hover:text-sky-400 transition" title="Edit"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteItem('${item.origTab}', '${item.id}')" class="text-slate-400 hover:text-red-400 transition" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById("table-body").innerHTML = bodyHtml;
            document.getElementById("record-count").innerText = `${combinedList.length} items`;
        }

        function getAllLocationOptions(currentSelected = "") {
            let optionsHtml = `<option value="N/A">N/A (Unknown)</option>`;
            
            (appData.Locations || []).forEach(loc => {
                const isSelected = loc[0] === currentSelected ? "selected" : "";
                optionsHtml += `<option value="${loc[0]}" ${isSelected}>[Base/Rig] ${loc[0]} - ${loc[3] || loc[1]}</option>`;
            });

            ['Unit', 'Container', 'Mast', 'PCE_Equipment'].forEach(tName => {
                const nameIdx = getNameColIndex(tName);
                const serialIdx = getSerialColIndex(tName);
                (appData[tName] || []).forEach(item => {
                    if (!item || !item[0]) return;
                    const itemId = String(item[0]);
                    const itemSerial = String(item[serialIdx] || item[1] || '');
                    const itemName = item[nameIdx] || item[1] || '';
                    const isSelected = (itemId === currentSelected || itemSerial === currentSelected) ? "selected" : "";
                    optionsHtml += `<option value="${itemSerial || itemId}" ${isSelected}>[${tName}] ${itemSerial || itemId} - ${itemName}</option>`;
                });
            });

            return optionsHtml;
        }

        function openMoveModal(tabName, itemId) {
            movingItemContext = { tabName, itemId };
            const row = (appData[tabName] || []).find(r => r[0] === itemId);
            if (!row) return;

            const nameIdx = getNameColIndex(tabName);
            document.getElementById("move-item-id").value = `${itemId} - ${row[nameIdx] || row[1] || ''}`;

            const locIndex = getLocationColIndex(tabName);
            const currentLocation = row[locIndex] || "";

            document.getElementById("move-target-location").innerHTML = getAllLocationOptions(currentLocation);
            document.getElementById("move-modal").classList.remove("hidden");
            document.getElementById("move-modal").classList.add("flex");
        }

        function closeMoveModal() {
            document.getElementById("move-modal").classList.remove("flex");
            document.getElementById("move-modal").classList.add("hidden");
        }

        function confirmMoveItem() {
            const { tabName, itemId } = movingItemContext;
            const newLocId = document.getElementById("move-target-location").value;
            const row = (appData[tabName] || []).find(r => r[0] === itemId);

            if (row) {
                const headers = tableHeaders[tabName] || [];
                const locIdIdx = getLocationColIndex(tabName);
                
                row[locIdIdx] = newLocId;

                const locNameIdx = headers.findIndex(h => String(h).toUpperCase() === 'LOCATION');
                if (locNameIdx !== -1) {
                    row[locNameIdx] = getLocationName(newLocId);
                }

                saveDataLocal();
                syncToGoogleSheet("update", tabName, row, itemId);
                closeMoveModal();
                renderTable(currentActiveTab);
                renderTree();
            }
        }

        function resetTreeFilter() {
            document.getElementById("tree-filter-badge").classList.add("hidden");
            renderTable(currentActiveTab);
        }

        function autoFillLocationName(inputEl) {
            const val = inputEl.value.trim();
            const form = inputEl.closest('form');
            if (!form) return;

            const locNameInput = Array.from(form.querySelectorAll('input')).find(inp => {
                const label = inp.previousElementSibling?.innerText || '';
                return label.toUpperCase() === 'LOCATION';
            });

            if (locNameInput && val) {
                locNameInput.value = getLocationName(val);
            }
        }

        function renderFormFields(rowData = null) {
            const tab = document.getElementById("form-target-tab").value;
            const container = document.getElementById("dynamic-fields-container");
            const headers = tableHeaders[tab] || ["ID", "Name"];
            
            let allLocIds = (appData.Locations || []).map(l => l[0]);
            ['Unit', 'Container', 'Mast', 'PCE_Equipment'].forEach(t => {
                (appData[t] || []).forEach(i => { 
                    if (i && i[0]) allLocIds.push(i[0]); 
                    if (i && i[3]) allLocIds.push(i[3]); 
                });
            });
            let optionsParent = [...new Set(allLocIds.filter(Boolean))].map(p => `<option value="${p}">${p}</option>`).join("");

            let html = `<datalist id="dl-loc-parents">${optionsParent}</datalist>`;

            headers.forEach((header, idx) => {
                const val = rowData && rowData[idx] !== undefined ? rowData[idx] : "";
                const isIdField = (idx === 0);
                const isLocationField = String(header).toLowerCase().includes("location");

                html += `
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">${header}</label>
                        <input type="text" name="f${idx}" value="${val}" ${isIdField && rowData ? 'readonly class="w-full bg-slate-850 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-400 cursor-not-allowed"' : 'class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent"'} ${isLocationField ? 'list="dl-loc-parents" oninput="autoFillLocationName(this)"' : ''} autocomplete="off">
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function openAddModal() {
            editingItemId = null;
            document.getElementById("modal-title").innerText = "Add New Equipment / Location";
            document.getElementById("submit-btn").innerText = "Save & Sync Sheet";
            document.getElementById("form-target-tab").disabled = false;
            document.getElementById("form-target-tab").value = currentActiveTab;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields();
        }

        function openEditModal(tabName, itemId) {
            if (!itemId || itemId === "N/A") return;
            editingItemId = itemId;
            const targetRow = (appData[tabName] || []).find(r => r[0] === itemId);
            if (!targetRow) return;
            document.getElementById("modal-title").innerText = `Edit: ${itemId}`;
            document.getElementById("submit-btn").innerText = "Update & Sync Sheet";
            document.getElementById("form-target-tab").value = tabName;
            document.getElementById("form-target-tab").disabled = true;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields(targetRow);
        }

        function closeModal() {
            document.getElementById("equipment-modal").classList.remove("flex");
            document.getElementById("equipment-modal").classList.add("hidden");
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const tab = document.getElementById("form-target-tab").value;
            if (!appData[tab] || !Array.isArray(appData[tab])) appData[tab] = [];

            let rowData = [];
            document.querySelectorAll("#dynamic-fields-container input").forEach(el => rowData.push(el.value));

            if (editingItemId) {
                const index = appData[tab].findIndex(r => r[0] === editingItemId);
                if (index !== -1) appData[tab][index] = rowData;
                saveDataLocal();
                syncToGoogleSheet("update", tab, rowData, editingItemId);
            } else {
                appData[tab].push(rowData);
                saveDataLocal();
                syncToGoogleSheet("append", tab, rowData);
            }

            closeModal();
            renderTable(currentActiveTab);
            renderTree();
        }

        // ĐÃ SỬA: Hiển thị modal chi tiết ĐÚNG 100% theo tiêu đề Excel (headers) của từng sheet
        function openDetailModal(tabName, itemId) {
            const row = (appData[tabName] || []).find(r => r[0] === itemId);
            if (!row) return;

            const headers = tableHeaders[tabName] || [];
            const locColIdx = getLocationColIndex(tabName);
            const locId = row[locColIdx] || "";
            const fullPath = getLocationPath(locId);

            const serialIdx = getSerialColIndex(tabName);
            const nameIdx = getNameColIndex(tabName);
            const currentId = String(row[0] || "");
            const currentSerial = String(row[serialIdx] || row[1] || "");

            let containedItems = [];
            Object.keys(appData).forEach(tName => {
                if (tName === "Locations" || tName === "_headers") return;
                const childLocIdx = getLocationColIndex(tName);
                const subNameIdx = getNameColIndex(tName);
                const subSerialIdx = getSerialColIndex(tName);
                
                (appData[tName] || []).forEach(childRow => {
                    if (!childRow || !Array.isArray(childRow)) return;
                    const childLoc = String(childRow[childLocIdx] || "");

                    if (childLoc && childLoc !== "N/A" && (childLoc === currentId || childLoc === currentSerial)) {
                        if (!(tName === tabName && childRow[0] === itemId)) {
                            let childSerial = childRow[subSerialIdx] || childRow[1] || 'N/A';
                            let childName = childRow[subNameIdx] || childRow[1] || 'Equipment';

                            containedItems.push({
                                origTab: tName,
                                id: String(childRow[0] || "N/A"),
                                name: String(childName),
                                serialNo: String(childSerial),
                                category: tName
                            });
                        }
                    }
                });
            });

            const mainName = nameIdx !== -1 ? (row[nameIdx] || 'Equipment') : (row[2] || row[1] || 'Equipment');
            const mainSerial = serialIdx !== -1 ? (row[serialIdx] || 'N/A') : (row[3] || row[1] || 'N/A');

            let contentHtml = `
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 space-y-4">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                        <span class="text-xs uppercase font-semibold text-sky-400">ID: ${row[0]}</span>
                        <span class="text-xs bg-slate-800 text-slate-300 px-2.5 py-0.5 rounded-full border border-slate-700">Group: ${tabName.replace(/_/g, ' ')}</span>
                    </div>

                    <div class="bg-sky-950/40 border border-sky-500/30 p-3 rounded-lg flex justify-between items-center">
                        <div>
                            <span class="text-sky-400 block text-[10px] uppercase font-bold mb-1"><i class="fa-solid fa-route mr-1"></i> Storage Location Path:</span>
                            <span class="text-white font-semibold text-xs">${fullPath}</span>
                        </div>
                        <button onclick="closeDetailModal(); openMoveModal('${tabName}', '${itemId}');" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition shadow">
                            <i class="fa-solid fa-right-left"></i> Move Location
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1 text-xs">
            `;

            // Vòng lặp hiển thị ĐÚNG tên cột từ file Excel và giá trị tương ứng
            headers.forEach((headerName, idx) => {
                let displayVal = row[idx] !== undefined && row[idx] !== null && row[idx] !== "" ? row[idx] : 'N/A';

                if (String(headerName).toUpperCase().includes('LOCATION') && (displayVal === 'N/A' || displayVal.startsWith('LOC_'))) {
                    displayVal = getLocationName(displayVal);
                }

                contentHtml += `
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[10px] uppercase font-medium">${headerName}</span>
                        <span class="text-slate-200 font-semibold text-sm mt-0.5 block">${displayVal}</span>
                    </div>
                `;
            });

            contentHtml += `</div>`;

            if (containedItems.length > 0) {
                contentHtml += `
                    <div class="pt-3 border-t border-slate-800">
                        <div class="flex justify-between items-center mb-2">
                            <h4 class="text-xs font-bold uppercase tracking-wider text-amber-400 flex items-center gap-2">
                                <i class="fa-solid fa-boxes-stacked"></i> Contained Equipment / Tools (${containedItems.length})
                            </h4>
                        </div>
                        <div class="overflow-x-auto border border-slate-700/70 rounded-lg max-h-48 overflow-y-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-800 text-slate-300 uppercase sticky top-0 font-semibold text-[11px]">
                                    <tr>
                                        <th class="px-3 py-2">No.</th>
                                        <th class="px-3 py-2">Equipment Name</th>
                                        <th class="px-3 py-2">Serial No</th>
                                        <th class="px-3 py-2">Category</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800 bg-slate-900/40">
                `;

                containedItems.forEach((sub, sIdx) => {
                    contentHtml += `
                        <tr class="hover:bg-slate-800/60 transition cursor-pointer" onclick="closeDetailModal(); openDetailModal('${sub.origTab}', '${sub.id}');">
                            <td class="px-3 py-2 text-slate-400 font-medium">${sIdx + 1}</td>
                            <td class="px-3 py-2 text-slate-200 font-medium">${sub.name}</td>
                            <td class="px-3 py-2 text-amber-300">${sub.serialNo}</td>
                            <td class="px-3 py-2 text-slate-400 text-[11px]">${sub.category.replace(/_/g, ' ')}</td>
                        </tr>
                    `;
                });

                contentHtml += `
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            contentHtml += `</div>`;

            document.getElementById("detail-modal-content").innerHTML = contentHtml;
            document.getElementById("detail-edit-btn").onclick = function() {
                closeDetailModal();
                openEditModal(tabName, itemId);
            };
            document.getElementById("detail-modal").classList.remove("hidden");
            document.getElementById("detail-modal").classList.add("flex");
        }

        function closeDetailModal() {
            document.getElementById("detail-modal").classList.remove("hidden");
            document.getElementById("detail-modal").classList.add("hidden");
        }

        function deleteItem(tabName, id) {
            if (!confirm(`Are you sure you want to delete record [${id}]?`)) return;
            appData[tabName] = appData[tabName].filter(row => row[0] !== id);
            saveDataLocal();
            syncToGoogleSheet("delete", tabName, [], id);
            renderTable(currentActiveTab);
            renderTree();
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ appData, headers: tableHeaders }, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `amsito_master_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.onload = initData;
    </script>
</body>
</html>
