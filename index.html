<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMSITO Slickline Master Asset & Maintenance Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#0ea5e9',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        success: '#10b981',
                        electronic: '#8b5cf6'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans" onclick="hideAllDropdowns(event)">

    <!-- Header -->
    <header class="bg-cardbg border-b border-slate-700 px-4 md:px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
        <div class="flex items-center space-x-3 w-full md:w-auto">
            <div class="bg-accent/10 p-2.5 rounded-lg border border-accent/20">
                <i class="fa-solid fa-oil-well text-accent text-2xl"></i>
            </div>
            <div>
                <h1 class="text-base md:text-xl font-bold tracking-wide uppercase text-white">AMSITO Slickline Master Asset Manager</h1>
                <p class="text-[11px] text-slate-400">Hệ thống quản lý phân cấp Kho - Giàn khoan - Toolstrings & Bảo dưỡng MPI/LT</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2 md:gap-3 w-full md:w-auto justify-end">
            <span id="sync-status" class="text-xs px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full flex items-center gap-1.5">
                <i class="fa-solid fa-cloud-arrow-up"></i> Connected
            </span>
            <button onclick="openAddModal()" class="bg-accent hover:bg-sky-600 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg font-medium text-xs md:text-sm flex items-center gap-1.5 transition shadow-md">
                <i class="fa-solid fa-plus"></i> Thêm Thiết Bị / Vị Trí
            </button>
            <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 md:py-2 rounded-lg text-xs md:text-sm flex items-center gap-1.5 transition">
                <i class="fa-solid fa-download"></i> Backup
            </button>
        </div>
    </header>

    <!-- Context Menu -->
    <div id="custom-context-menu" class="hidden fixed bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1.5 z-50 text-xs w-48 divide-y divide-slate-800">
        <div class="px-3 py-2 text-[10px] font-semibold text-slate-400 uppercase bg-slate-800/50 truncate" id="ctx-menu-title">Tùy chọn</div>
        <div class="py-1">
            <button onclick="ctxAction('view')" class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-sky-600 hover:text-white flex items-center gap-2 transition">
                <i class="fa-solid fa-circle-info text-sky-400"></i> Xem chi tiết
            </button>
            <button onclick="ctxAction('edit')" class="w-full text-left px-3 py-1.5 text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2 transition">
                <i class="fa-solid fa-pen text-sky-400"></i> Chỉnh sửa / Đổi tên
            </button>
            <button onclick="ctxAction('delete')" class="w-full text-left px-3 py-1.5 text-red-400 hover:bg-red-600 hover:text-white flex items-center gap-2 transition">
                <i class="fa-solid fa-trash-can"></i> Xóa thiết bị
            </button>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <main class="p-4 md:p-6 max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Sidebar: Hierarchy Tree -->
        <aside class="lg:col-span-1 bg-cardbg border border-slate-700/60 rounded-xl p-4 shadow-xl flex flex-col h-[65vh] lg:h-[78vh]">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-3">
                <h2 class="text-xs md:text-sm font-semibold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-sitemap text-accent"></i> Vị Trí & Cây Phân Cấp
                </h2>
                <span id="total-nodes-badge" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded">0 vị trí</span>
            </div>
            
            <div class="mb-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    <input type="text" id="tree-search" placeholder="Tìm kiếm vị trí..." oninput="filterTree(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-accent">
                </div>
            </div>

            <div id="tree-container" class="flex-1 overflow-y-auto space-y-1.5 pr-1 text-xs select-none">
                <!-- Cây vị trí phân cấp -->
            </div>
        </aside>

        <!-- Content Area: Tables & Detail View -->
        <section class="lg:col-span-3 flex flex-col gap-4 md:gap-6">
            
            <!-- Filter Tabs -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl p-3 shadow-md relative">
                <div class="flex flex-wrap gap-1.5 items-center justify-start" id="tab-buttons">
                    <button onclick="switchTab('Locations')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white transition" data-tab="Locations">
                        <i class="fa-solid fa-location-dot mr-1"></i> Locations
                    </button>
                    <button onclick="switchTab('Slickline_Toolstrings')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Toolstrings">
                        <i class="fa-solid fa-screwdriver-wrench mr-1 text-sky-300"></i> Slickline Tools
                    </button>
                    <button onclick="switchTab('Containers_Units')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Containers_Units">
                        <i class="fa-solid fa-box mr-1"></i> Container & Box
                    </button>
                    <button onclick="switchTab('Slickline_Units_Mast')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Slickline_Units_Mast">
                        <i class="fa-solid fa-truck-monster mr-1"></i> Unit & Mast
                    </button>
                    
                    <!-- Dropdown: Tang Cáp & Sợi Cáp -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-drums-wires')" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-dharmachakra text-amber-400"></i> Tang Cáp & Sợi Cáp <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-drums-wires" class="hidden absolute left-0 mt-1 w-44 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('Slickline_Drums'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-dharmachakra text-amber-400"></i> Tang Cáp (Drums)</button>
                            <button onclick="switchTab('Slickline_Wires'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-circle-notch text-sky-400"></i> Sợi Cáp (Wires)</button>
                        </div>
                    </div>

                    <button onclick="switchTab('PCE_Equipment')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="PCE_Equipment">
                        <i class="fa-solid fa-shield-halved mr-1"></i> PCE
                    </button>
                    <button onclick="switchTab('Mechanical_Tools')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition" data-tab="Mechanical_Tools">
                        <i class="fa-solid fa-wrench mr-1"></i> Cơ Khí Khác
                    </button>

                    <!-- Dropdown: Logging (Battery, PPS Gauge, MPLT) -->
                    <div class="relative inline-block text-left">
                        <button onclick="toggleDropdown(event, 'dropdown-logging')" class="tab-dropdown-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-microchip text-purple-400"></i> Logging <i class="fa-solid fa-chevron-down text-[10px] ml-1"></i>
                        </button>
                        <div id="dropdown-logging" class="hidden absolute left-0 mt-1 w-48 bg-slate-900 border border-slate-700 rounded-xl shadow-xl z-30 py-1 divide-y divide-slate-800">
                            <button onclick="switchTab('Electronic_Logging_Tools'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-microchip text-purple-400"></i> MPLT / Tools</button>
                            <button onclick="switchTab('PPS_Gauge'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-gauge text-sky-400"></i> PPS Gauge</button>
                            <button onclick="switchTab('Battery_List'); hideAllDropdowns()" class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-accent hover:text-white flex items-center gap-2"><i class="fa-solid fa-battery-full text-emerald-400"></i> Battery (Pin)</button>
                        </div>
                    </div>

                    <button onclick="switchTab('MPI_LT')" class="tab-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-900/60 border border-rose-500/40 text-rose-200 hover:bg-rose-800 transition" data-tab="MPI_LT">
                        <i class="fa-solid fa-file-contract mr-1 text-rose-400"></i> MPI / LT
                    </button>
                </div>
            </div>

            <!-- Table Display Container -->
            <div class="bg-cardbg border border-slate-700/60 rounded-xl shadow-xl flex-1 flex flex-col overflow-hidden">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
                    <div class="flex items-center gap-2">
                        <h3 id="current-table-title" class="font-semibold text-xs md:text-sm text-white uppercase tracking-wide">Danh sách</h3>
                        <span id="tree-filter-badge" class="hidden text-[11px] bg-sky-500/20 text-sky-300 border border-sky-500/30 px-2 py-0.5 rounded-md">
                            Lọc theo Vị Trí Cây <button onclick="resetTreeFilter()" class="ml-1 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </span>
                    </div>
                    <div class="text-xs text-slate-400" id="record-count">0 bản ghi</div>
                </div>

                <div class="w-full overflow-x-auto overflow-y-auto max-h-[60vh]">
                    <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                        <thead id="table-head" class="bg-slate-900/90 text-slate-400 uppercase font-medium border-b border-slate-700 sticky top-0 z-10">
                            <!-- Injected by JS -->
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-800">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <!-- Modal Form Thêm / Sửa Thiết Bị -->
    <div id="equipment-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold text-base text-white">Thêm Mới Thiết Bị / Vị Trí</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="dynamic-form" onsubmit="handleFormSubmit(event)" autocomplete="off" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Chọn Nhóm Quản Lý (Tab mục tiêu)</label>
                    <select id="form-target-tab" onchange="renderFormFields()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                        <option value="Locations">1. Locations (Vị Trí Lưu Trữ)</option>
                        <option value="Slickline_Toolstrings">2. Slickline Tools</option>
                        <option value="Containers_Units">3. Container & Box</option>
                        <option value="Slickline_Units_Mast">4. Slickline Unit & Mast</option>
                        <option value="Slickline_Drums">5. Tang Cáp (Drums)</option>
                        <option value="Slickline_Wires">6. Sợi Cáp (Wires)</option>
                        <option value="PCE_Equipment">7. PCE Equipment</option>
                        <option value="Mechanical_Tools">8. Dụng Cụ Cơ Khí</option>
                        <option value="Electronic_Logging_Tools">9. MPLT / Tools</option>
                        <option value="PPS_Gauge">10. PPS Gauge</option>
                        <option value="Battery_List">11. Battery (Pin)</option>
                        <option value="MPI_LT">12. Quản Lý Bảo Dưỡng MPI / LT</option>
                    </select>
                </div>

                <div id="dynamic-fields-container" class="space-y-4"></div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition">Hủy</button>
                    <button type="submit" id="submit-btn" class="px-5 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Lưu & Đồng Bộ Sheet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Chi Tiết -->
    <div id="detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-circle-info text-sky-400"></i> Thông Tin Chi Tiết Thiết Bị
                </h3>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-6 max-h-[75vh] overflow-y-auto" id="detail-modal-content"></div>

            <div class="px-6 py-3 bg-slate-800/80 border-t border-slate-700 flex justify-end gap-3">
                <button type="button" onclick="closeDetailModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Đóng</button>
                <button type="button" id="detail-edit-btn" class="px-4 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Chỉnh Sửa Thiết Bị</button>
            </div>
        </div>
    </div>

    <!-- Modal Move Thiết Bị -->
    <div id="move-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cardbg border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-right-left text-accent"></i> Di Chuyển Thiết Bị
                </h3>
                <button onclick="closeMoveModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Thiết bị đang chọn:</label>
                    <input type="text" id="move-item-id" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-sky-400 font-semibold cursor-not-allowed">
                </div>
                <div>
                    <label class="block text-xs text-slate-300 mb-1">Chọn Vị Trí / Container Đích Đến Mới:</label>
                    <select id="move-target-location" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-accent">
                        <!-- Injected by JS -->
                    </select>
                </div>
            </div>

            <div class="px-6 py-3 bg-slate-800/80 border-t border-slate-700 flex justify-end gap-3">
                <button type="button" onclick="closeMoveModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium transition">Hủy</button>
                <button type="button" onclick="confirmMoveItem()" class="px-4 py-2 bg-accent hover:bg-sky-600 text-white rounded-lg text-xs font-medium transition shadow-md">Xác Nhận Di Chuyển</button>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const GOOGLE_SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwMDTOYtAqzbv7oyMUZyo1CnMklu4LE8h7UZoG469Tg1gMTb1SIQc6WrweOWCi1um40/exec";

        let appData = {
            Locations: [
                ["LOC_BASE", "Base", "AMSITO", "AMS Base (Kho / Xưởng Vũng Tàu)", "", "Active"],
                ["LOC_TGT_H1", "Platform", "HLHV", "Giàn Platform TGT-H1", "", "Active"],
                ["LOC_PLAT_E1", "Platform", "JVPC", "Giàn Platform E1", "", "Active"],
                ["RIG_PVD1", "Rig", "PVD", "Giàn khoan PVD1", "", "Active"],
                ["AMS_C22", "Container", "AMSITO", "Container AMS-C22", "LOC_BASE", "Active"],
                ["UNIT_101373", "Winch Unit", "AMSITO", "ASEP Wireline Unit 101373", "LOC_BASE", "Active"],
                ["UNIT_101490", "Winch Unit", "AMSITO", "ASEP Wireline Unit 101490", "LOC_TGT_H1", "Active"],
                ["BASKET_MAST01", "Mast Basket", "AMSITO", "Basket chứa MAST01", "LOC_TGT_H1", "Active"],
                ["AMS_R29", "PCE Frame", "AMSITO", "PCE Frame AMS-R29", "LOC_PLAT_E1", "Active"],
                ["DRAW_1", "Ngăn kéo", "AMSITO", "Draw 1 (Trong AMS-C22)", "AMS_C22", "Active"],
                ["WINCH_FRONT", "Winch Drum Pos", "AMSITO", "Tang cáp Phía Trước", "UNIT_101373", "Active"]
            ],
            Slickline_Toolstrings: [],
            Containers_Units: [],
            Slickline_Units_Mast: [],
            Slickline_Drums: [],
            Slickline_Wires: [],
            PCE_Equipment: [],
            Mechanical_Tools: [],
            Electronic_Logging_Tools: [],
            PPS_Gauge: [
                ["PPS001", "PPS Multi-Sensor Gauge", "PPS-9000", "150°C", "10k PSI", "LOC_BASE", "Active", "2026-01-10: Hạ giàn TGT-H1 | 2026-03-15: Bảo dưỡng định kỳ"]
            ],
            Battery_List: [
                ["BAT001", "High-Temp Lithium Pack", "LTC-7PN", "2025-05-10", "2025-06-01", "2027-06-01", "Good", "LOC_BASE", "2026-02-12: Sử dụng cho tool MPLT-01"]
            ],
            MPI_LT: [
                ["MPIL001", "ASEP WIRELINE UNIT", "101373", "16-Dec-25", "16-Dec-26", "22-Jun-26", "21-Jun-28", "", "LOC_BASE", "Active"],
                ["MPIL002", "FLYLINE WINCH UNIT FRAME", "103358-F", "13-Apr-26", "11-Oct-26", "8-Nov-25", "8-Nov-26", "", "LOC_BASE", "Warehouse"]
            ]
        };

        const tableHeaders = {
            Locations: ["STT", "Location ID", "Phân loại", "AMSITO / Client", "Tên Vị Trí / Mô Tả", "Parent ID", "Trạng thái"],
            Slickline_Toolstrings: ["STT", "Tool ID", "Description", "Contract Inquire", "Qty", "Length (m)", "Weight (Lbs)", "Part NO", "Asset NO", "Location", "Brand", "Status / Remark"],
            Containers_Units: ["STT", "Container ID", "Asset / Serial No", "Type / Equipment", "Location ID", "MPI Expiry", "Load Test Expiry", "Status"],
            Slickline_Units_Mast: ["STT", "Unit ID", "Equipment Name", "Serial No", "Power / Capacity & Size", "Location ID", "Recert Expiry", "Status"],
            Slickline_Drums: ["STT", "Drum ID / Name", "DRUM Description", "Wire Information", "Cert Number", "Spool Date", "Length (m)", "Location", "Remark"],
            Slickline_Wires: ["STT", "Wire ID", "Wire Type", "Wire Size", "Serial No", "Breaking Strength", "Actual Length (ft)", "Parent Drum ID", "Lịch sử sử dụng", "Status"],
            PCE_Equipment: ["STT", "PCE ID", "Equipment Type", "Serial No", "WP (PSI)", "Service", "Connection", "Parent Container", "Location ID", "Pressure Test Expire", "Status"],
            Mechanical_Tools: ["STT", "Tool ID", "Category", "OD Size", "Asset / Serial No", "Connection Thread", "Parent Container", "Location ID", "Status"],
            Electronic_Logging_Tools: ["STT", "Tool ID", "Equipment Name", "Serial No", "OD Size", "Firmware / Specs", "Calibration Status", "Parent Container", "Location ID", "Status"],
            PPS_Gauge: ["STT", "Gauge ID", "Equipment Name", "Serial No (Asset)", "Max Temp", "Max Pressure", "Location ID", "Status", "Lịch sử sử dụng & Ngày tháng"],
            Battery_List: ["STT", "Battery ID", "Part Number / Chủng loại", "Serial Number", "Ngày sản xuất", "Ngày mua", "Hạn sử dụng", "Tình trạng", "Location ID", "Lịch sử sử dụng"],
            MPI_LT: ["STT", "ID", "Equipment Name", "Asset NO", "MPI Test Date", "MPI Expire Date", "LT Test Date", "LT Expire Date", "Pressure Test Expire", "Location ID", "Status"]
        };

        const locationColMap = {
            Locations: 4,
            Slickline_Toolstrings: 9,
            Containers_Units: 4,
            Slickline_Units_Mast: 4,
            Slickline_Drums: 7,
            Slickline_Wires: 7,
            PCE_Equipment: 8,
            Mechanical_Tools: 7,
            Electronic_Logging_Tools: 8,
            PPS_Gauge: 6,
            Battery_List: 8,
            MPI_LT: 8
        };

        let currentActiveTab = "Locations";
        let editingItemId = null;
        let movingItemContext = { tabName: null, itemId: null };

        function toggleDropdown(event, dropdownId) {
            event.stopPropagation();
            const el = document.getElementById(dropdownId);

        function getLocationName(locId) {
            if (!locId || locId === "N/A") return "N/A";
            const found = (appData.Locations || []).find(l => l[0] === locId);
            return found ? `${locId} (${found[3]})` : locId;
        }

        function getLocationPath(locId) {
            if (!locId || locId === "N/A") return "Vị trí không xác định (N/A)";
            const locs = appData.Locations || [];
            let path = [];
            let currId = locId;
            let visited = new Set();

            while (currId && !visited.has(currId)) {
                visited.add(currId);
                const found = locs.find(l => l[0] === currId);
                if (found) {
                    path.unshift(found[3] || found[0]);
                    currId = found[4];
                } else {
                    path.unshift(currId);
                    break;
                }
            }
            return path.join(" ➔ ");
        }

        function syncMpiLtToCorrespondingTabs() {
            const mpiList = appData.MPI_LT || [];
            mpiList.forEach(item => {
                const id = item[0];
                const eqName = item[1] || "";
                const assetNo = item[2] || "";
                const locId = item[8] || "N/A";
                const status = item[9] || "Active";
                const upperName = eqName.toUpperCase();

                let targetTab = "";
                let newRow = [];

                if (upperName.includes("UNIT") || upperName.includes("WINCH") || upperName.includes("MAST")) {
                    targetTab = "Slickline_Units_Mast";
                    newRow = [id, eqName, assetNo, "", locId, "", status];
                } else if (upperName.includes("CONTAINER") || upperName.includes("SKID") || upperName.includes("BOX")) {
                    targetTab = "Containers_Units";
                    newRow = [id, assetNo, eqName, locId, item[4] || "", item[6] || "", status];
                } else if (upperName.includes("SLING") || upperName.includes("SHACKLE") || upperName.includes("TOOL")) {
                    targetTab = "Slickline_Toolstrings";
                    newRow = [id, eqName, upperName, "", "1", "", "", "", assetNo, locId, "", status];
                } else if (upperName.includes("DRUM") || upperName.includes("CÁP")) {
                    targetTab = "Slickline_Drums";
                    newRow = [id, eqName, upperName, "", "", "", "", locId, status];
                } else if (upperName.includes("PCE") || upperName.includes("BOP") || upperName.includes("LUBRICATOR")) {
                    targetTab = "PCE_Equipment";
                    newRow = [id, eqName, upperName, assetNo, "", "", "", "", locId, "", status];
                }

                if (targetTab && appData[targetTab]) {
                    const existingIdx = appData[targetTab].findIndex(r => r[0] === id);
                    if (existingIdx !== -1) {
                        appData[targetTab][existingIdx][0] = id;
                        appData[targetTab][existingIdx][1] = eqName;
                        if (targetTab === "Slickline_Units_Mast") {
                            appData[targetTab][existingIdx][2] = assetNo;
                            appData[targetTab][existingIdx][4] = locId;
                        }
                    } else {
                        appData[targetTab].push(newRow);
                    }
                }
            });
        }

        async function initData() {
            const indicator = document.getElementById("sync-status");
            let loadedFromServer = false;

            if (GOOGLE_SHEET_API_URL) {
                try {
                    indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Loading...`;
                    const response = await fetch(GOOGLE_SHEET_API_URL);
                    const data = await response.json();
                    
                    if (data && data.Locations && data.Locations.length > 0) {
                        appData = data;
                        loadedFromServer = true;
                        indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Connected`;
                    }
                } catch (e) {
                    console.log("Không tải được từ Google Sheet:", e);
                }
            }

            if (!loadedFromServer) {
                const saved = localStorage.getItem("slickline_asset_master_v18");
                if (saved) {
                    try { 
                        appData = JSON.parse(saved); 
                        indicator.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-400"></i> Offline Mode`;
                    } catch (err) { console.error(err); }

            }

            syncMpiLtToCorrespondingTabs();

        async function syncToGoogleSheet(action, sheetName, rowData, itemId = null) {
            if (!GOOGLE_SHEET_API_URL) return;
            try {
                const payload = { action: action, sheetName: sheetName, row: rowData, id: itemId };
                const indicator = document.getElementById("sync-status");
                indicator.innerHTML = `<i class="fa-solid fa-rotate fa-spin text-amber-400"></i> Syncing...`;

                fetch(GOOGLE_SHEET_API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.log("Background sync triggered"));

                setTimeout(() => {
                    indicator.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Connected`;
                }, 800);
            } catch (error) {
                console.error("Lỗi đồng bộ Google Sheet:", error);

        function getExpiryStatus(dateStr) {
            if (!dateStr) return { status: 'valid', days: 999 };
            let expDate;
            try {
                expDate = new Date(dateStr);
                if (isNaN(expDate.getTime())) {
                    const parts = dateStr.split('-');
                    if (parts.length === 3) {
                        const months = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
                        const day = parseInt(parts[0]);
                        const month = months[parts[1].toLowerCase()];
                        let year = parseInt(parts[2]);
                        if (year < 100) year += 2000;
                        expDate = new Date(year, month, day);
                    }
                }
            } catch(e) { return { status: 'valid', days: 999 }; }

            if (!expDate || isNaN(expDate.getTime())) return { status: 'valid', days: 999 };

            const today = new Date();
            const diffTime = expDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 0) return { status: 'expired', days: diffDays };
            if (diffDays <= 30) return { status: 'warning', days: diffDays };
            return { status: 'valid', days: diffDays };
        }

                    <div><label class="block text-xs text-slate-300 mb-1">Lịch sử sử dụng & Ngày tháng</label><textarea name="f7" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" placeholder="VD: 2026-01-10: Hạ giàn TGT-H1">${val(7)}</textarea></div>

                    <div><label class="block text-xs text-slate-300 mb-1">Equipment Name</label><input type="text" name="f1" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(1)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Asset NO (Serial chuẩn định danh)</label><input type="text" name="f2" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(2)}"></div>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-xs text-slate-300 mb-1">MPI Test Date</label><input type="text" name="f3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(3)}"></div>
                        <div><label class="block text-xs text-slate-300 mb-1">MPI Expire Date</label><input type="text" name="f4" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(4)}"></div>

                    <div class="grid grid-cols-2 gap-2">

                        <div><label class="block text-xs text-slate-300 mb-1">LT Expire Date</label><input type="text" name="f6" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(6)}"></div>
                    </div>

                    <div><label class="block text-xs text-slate-300 mb-1">Location ID</label><input type="text" name="f8" list="dl-loc-parents" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(8)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Status / Remark</label><input type="text" name="f9" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(9, 'Active')}"></div>
                `;
            } else if (tab === "Locations") {
                html = `
                    <datalist id="dl-loc-parents">${optionsParent}</datalist>
                    <div><label class="block text-xs text-slate-300 mb-1">Location ID</label><input type="text" name="f0" required autocomplete="off" ${rowData ? 'readonly class="w-full bg-slate-850 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-400 cursor-not-allowed"' : 'class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white"'} value="${val(0)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Phân loại</label><input type="text" name="f1" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(1)}"></div>

                    <div><label class="block text-xs text-slate-300 mb-1">Tên Vị Trí / Mô Tả</label><input type="text" name="f3" required autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(3)}"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Parent ID</label><input type="text" name="f4" list="dl-loc-parents" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(4)}"></div>

                    <div><label class="block text-xs text-slate-300 mb-1">Thông số / Serial</label><input type="text" name="f2" autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white" value="${val(2)}"></div>

        function openAddModal() {
            editingItemId = null;
            document.getElementById("modal-title").innerText = "Thêm Mới Thiết Bị / Vị Trí";
            document.getElementById("submit-btn").innerText = "Lưu & Đồng Bộ Sheet";
            document.getElementById("form-target-tab").disabled = false;
            document.getElementById("form-target-tab").value = currentActiveTab;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields();
        }

        function openEditModal(tabName, itemId) {
            if (!itemId || itemId === "N/A") return;
            editingItemId = itemId;
            const targetRow = (appData[tabName] || []).find(r => r[0] === itemId);
            if (!targetRow) return;
            document.getElementById("modal-title").innerText = `Chỉnh Sửa: ${itemId}`;
            document.getElementById("submit-btn").innerText = "Cập Nhật & Đồng Bộ Sheet";
            document.getElementById("form-target-tab").value = tabName;
            document.getElementById("form-target-tab").disabled = true;
            document.getElementById("equipment-modal").classList.remove("hidden");
            document.getElementById("equipment-modal").classList.add("flex");
            renderFormFields(targetRow);
        }

        function closeModal() {
            document.getElementById("equipment-modal").classList.remove("flex");
            document.getElementById("equipment-modal").classList.add("hidden");
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            const tab = document.getElementById("form-target-tab").value;
            if (!appData[tab] || !Array.isArray(appData[tab])) appData[tab] = [];

            let rowData = [];
            document.querySelectorAll("#dynamic-fields-container input, #dynamic-fields-container select, #dynamic-fields-container textarea").forEach(el => rowData.push(el.value));

            if (editingItemId) {
                const index = appData[tab].findIndex(r => r[0] === editingItemId);
                if (index !== -1) appData[tab][index] = rowData;
                saveDataLocal();
                syncToGoogleSheet("update", tab, rowData, editingItemId);
            } else {
                appData[tab].push(rowData);
                saveDataLocal();
                syncToGoogleSheet("append", tab, rowData);
            }

            closeModal();
            renderTable(currentActiveTab);
            renderTree();
        }

        function openDetailModal(tabName, itemId) {
            const row = (appData[tabName] || []).find(r => r[0] === itemId);
            if (!row) return;

            const headers = tableHeaders[tabName] || [];
            const locColIdx = locationColMap[tabName] ?? 2;
            const locId = row[locColIdx] || "";
            const fullPath = getLocationPath(locId);

            let contentHtml = `
                <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700 space-y-3">
                    <div class="flex justify-between items-center pb-2 border-b border-slate-800">
                        <span class="text-xs uppercase font-semibold text-sky-400">Mã Định Danh (ID): ${row[0]}</span>
                        <span class="text-xs px-2.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">${row[row.length - 1] || 'Active'}</span>
                    </div>

                    <div class="bg-sky-950/40 border border-sky-500/30 p-3 rounded-lg flex justify-between items-center">
                        <div>
                            <span class="text-sky-400 block text-[10px] uppercase font-bold mb-1"><i class="fa-solid fa-route mr-1"></i> Đường Đi Vị Trí Lưu Trữ:</span>
                            <span class="text-white font-semibold text-xs">${fullPath}</span>
                        </div>
                        <button onclick="closeDetailModal(); openMoveModal('${tabName}', '${itemId}');" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 transition shadow">
                            <i class="fa-solid fa-right-left"></i> Chuyển Vị Trí
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-1 text-xs">
            `;

            row.forEach((val, idx) => {
                if (idx === 0) return;
                const headerName = headers[idx] || `Thuộc tính ${idx}`;
                contentHtml += `
                    <div class="bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 block text-[10px] uppercase font-medium">${headerName}</span>
                        <span class="text-slate-200 font-semibold text-sm mt-0.5 block">${val || 'N/A'}</span>
                    </div>
                `;
            });

            contentHtml += `</div></div>`;
            document.getElementById("detail-modal-content").innerHTML = contentHtml;
            document.getElementById("detail-edit-btn").onclick = function() {
                closeDetailModal();
                openEditModal(tabName, itemId);
            };
            document.getElementById("detail-modal").classList.remove("hidden");
            document.getElementById("detail-modal").classList.add("flex");
        }

        function closeDetailModal() {
            document.getElementById("detail-modal").classList.remove("hidden");
            document.getElementById("detail-modal").classList.add("hidden");
        }

        function deleteItem(tabName, id) {
            if (!confirm(`Bạn có chắc muốn xóa bản ghi [${id}] này không?`)) return;
            appData[tabName] = appData[tabName].filter(row => row[0] !== id);
            saveDataLocal();
            syncToGoogleSheet("delete", tabName, [], id);
            renderTable(currentActiveTab);
            renderTree();
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `slickline_master_v18_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        window.onload = initData;
    </script>
</body>
</html>
